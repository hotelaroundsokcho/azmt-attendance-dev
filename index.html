<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>[DEV] AZMT 근태 통합 시스템</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* ===== 디자인 토큰 (v13 미리보기와 동일 계열 유지) ===== */
:root{
  --bg:#EDF1F3; --surface:#FAFBFC; --surface-2:#F1F5F7; --ink:#13232B; --ink-2:#496069; --line:#D3DDE2;
  --accent:#1D5C72; --accent-soft:#DCEAF0; --accent-line:#8DB3C1; --on-accent:#FFFFFF;
  --ok:#1D7A52; --ok-soft:#DDF0E6; --warn:#A9650A; --warn-soft:#F8EBD2; --crit:#B03A30; --crit-soft:#F6DEDB;
  --lamp:#D99A1B;
  --font-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0E1A20; --surface:#15252D; --surface-2:#1B2F38; --ink:#E4EEF2; --ink-2:#9AB0BA; --line:#2A424C;
    --accent:#6BBAD0; --accent-soft:#1E3A45; --accent-line:#3E6B7B; --on-accent:#0A1A20;
    --ok:#5CC596; --ok-soft:#183A2D; --warn:#E3A84A; --warn-soft:#3C2E14; --crit:#F0847A; --crit-soft:#431E1B;
    --lamp:#F2B84B;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;
  padding:env(safe-area-inset-top) max(16px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(16px,env(safe-area-inset-left))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
[hidden]{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,p{margin:0}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.sub{color:var(--ink-2);font-size:14px}

/* ===== 로그인·PIN 변경 ===== */
.auth{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding-block:24px}
.auth-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px 22px 20px;
  animation:rise .22s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:13px;letter-spacing:.16em;color:var(--ink-2);text-transform:uppercase}
.brand i{width:8px;height:8px;border-radius:50%;background:var(--lamp);box-shadow:0 0 8px var(--lamp);display:inline-block}
.auth-card h1{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:10px 0 4px}
.auth-card h1:focus{outline:none}
.fld{margin-top:16px}
.fld label{display:block;font-size:14px;color:var(--ink-2);margin-bottom:4px}
.fld .row{display:flex;gap:8px}
.fld input,.fld select{width:100%;min-height:46px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 12px;font-size:17px}
.fld input.mono{letter-spacing:.12em}
.fld input[aria-invalid="true"],.fld select[aria-invalid="true"]{border-color:var(--crit)}
.fld .hint{font-size:13px;color:var(--ink-2);margin-top:4px}
.btn{min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 16px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.block{width:100%;margin-top:20px;min-height:48px;font-size:17px}
.btn.small{min-height:40px;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.msg{border-radius:9px;padding:9px 12px;font-size:15px;margin-top:14px}
.msg.bad{background:var(--crit-soft);color:var(--crit)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.msg.info{background:var(--accent-soft);color:var(--ink)}
.msg.warn{background:var(--warn-soft);color:var(--ink)}
.foot{margin-top:18px;color:var(--ink-2);font-size:13px}

/* ===== 로그인 후 화면 ===== */
.app{max-width:1120px;margin:0 auto;padding-block:16px 48px;display:flex;flex-direction:column;gap:14px}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.bar h1{font-size:19px;font-weight:600;letter-spacing:-.01em}
.who{color:var(--ink-2);font-size:14px}
.who b{color:var(--ink);font-weight:600}
.bar .actions{display:flex;gap:8px}
.nav{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.nav button{border:0;background:transparent;padding:11px 14px;color:var(--ink-2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;min-height:44px}
.nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.nav .soon{font-family:var(--font-mono);font-size:11px;color:var(--ink-2);margin-left:6px;border:1px solid var(--line);border-radius:99px;padding:0 6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h2{font-size:17px;font-weight:600;margin-bottom:6px}
.dl{display:grid;grid-template-columns:96px 1fr;gap:6px 12px;margin:10px 0 0}
.dl dt{color:var(--ink-2);font-size:14px}
.dl dd{margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.scroll{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;min-width:360px;margin-top:8px}
.t th,.t td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
.t th{font-size:14px;color:var(--ink-2);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:1px 10px;font-size:14px;font-weight:600;background:var(--ok-soft);color:var(--ok)}
.pill.off{background:var(--surface-2);color:var(--ink-2)}
.ver{color:var(--ink-2);font-size:12px;font-family:var(--font-mono)}
.or{display:flex;align-items:center;gap:10px;color:var(--ink-2);font-size:13px;margin:20px 0 12px}
.or::before,.or::after{content:'';flex:1;height:1px;background:var(--line)}
.gbtn{display:flex;justify-content:center;min-height:44px}
.gwrap .sub{margin-top:8px;font-size:13px}
.clockcard{text-align:center;padding-block:20px}
.bigtime{font-size:clamp(44px,15vw,64px);font-weight:500;letter-spacing:.02em;line-height:1.1;margin:6px 0 10px}
.state-row{display:flex;align-items:center;justify-content:center;gap:10px}
.state-text{font-weight:500}
.lamp{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block;flex:none}
.lamp.on{background:var(--lamp);box-shadow:0 0 8px var(--lamp);animation:glow 2.4s ease-in-out infinite}
.lamp.done{background:var(--ok)}
@keyframes glow{0%,100%{box-shadow:0 0 4px var(--lamp)}50%{box-shadow:0 0 12px var(--lamp)}}
.btn.clockbtn{min-height:68px;font-size:20px;width:100%}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
#main table.t{min-width:0}
#main .t td,#main .t th{padding-inline:4px}
#main .t .pill{font-size:13px;padding:1px 8px;margin:1px 0}
.pill{white-space:nowrap}

/* ===== 7-3 관리 화면 ===== */
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.info{background:var(--accent-soft);color:var(--ink)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end;justify-content:space-between}
.toolbar .fld{margin-top:0;min-width:180px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:520px){.row2{grid-template-columns:1fr}}
.acts{display:flex;flex-wrap:wrap;gap:6px}
#main .t td.acts-cell{min-width:128px}
.formcard{border-color:var(--accent-line)}
.formcard h2{margin-bottom:2px}
.formbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.formbtns .btn{margin:0}
.pinbox{border:2px dashed var(--lamp);background:var(--warn-soft);border-radius:10px;padding:14px;text-align:center;margin-top:12px}
.pinbox .big{font-size:30px;letter-spacing:.24em;font-weight:500;margin:6px 0}
.chk{display:flex;gap:10px;align-items:center;min-height:44px}
.chk input{width:20px;height:20px;margin:0}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;font-weight:500;min-height:0}
@media (prefers-reduced-motion:reduce){.lamp.on{animation:none}}
@media (prefers-reduced-motion:reduce){.auth-card{animation:none}}

/* ===== 7-4: 월간 근무계획 ===== */
.queue{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.queue li{display:flex;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0}
.palette{display:flex;flex-wrap:wrap;gap:6px}
.brushbtn[aria-pressed=true]{outline:3px solid var(--accent);outline-offset:1px;background:var(--accent-soft)}
.plan-scroll{max-height:70vh;overflow:auto;border:1px solid var(--line);border-radius:9px;margin-top:8px}
.plangrid{border-collapse:separate;border-spacing:0;font-size:14px}
.plangrid th,.plangrid td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;text-align:center;background:var(--surface)}
.plangrid thead th{position:sticky;top:0;z-index:2;background:var(--surface-2);color:var(--ink-2);font-weight:500;min-width:40px}
.plangrid .who-col{position:sticky;left:0;z-index:1;text-align:left;min-width:96px;max-width:132px;padding:4px 8px;background:var(--surface-2)}
.plangrid thead .who-col{z-index:3}
.plangrid .tot-col{min-width:104px;padding:4px 8px;font-size:13px;white-space:nowrap}
.plangrid td.na{color:var(--ink-2);opacity:.5;min-width:40px}
.colhead,.rowhead{background:none;border:0;padding:4px 2px;display:flex;flex-direction:column;align-items:center;width:100%;min-height:40px;justify-content:center;font-weight:500;color:inherit}
.rowhead{align-items:flex-start;padding-inline:0}
.dow{display:block;font-size:11px;color:var(--ink-2);font-weight:400}
.plangrid th.we .colhead{color:var(--crit)}
.plangrid th.tdy{box-shadow:inset 0 -3px 0 var(--accent)}
.cell{display:block;width:100%;min-width:40px;min-height:44px;border:0;border-radius:0;background:transparent;font-family:var(--font-mono);font-weight:600;font-size:14px;padding:0}
.cell.t-WORK{background:var(--accent-soft);color:var(--accent)}
.cell.t-LEAVE{background:var(--warn-soft);color:var(--warn)}
.cell.t-OFF{background:var(--surface-2);color:var(--ink-2)}
.cell.t-X{background:var(--crit-soft);color:var(--crit)}
.cell.empty{color:var(--ink-2);opacity:.6}
.cell.dirty{box-shadow:inset 0 0 0 3px var(--lamp)}
.cell:disabled{cursor:default}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px}
.lg{display:inline-flex;align-items:center;gap:4px;font-size:14px}
.lg-code{display:inline-block;width:auto;min-width:28px;min-height:0;padding:1px 6px;border-radius:6px;text-align:center}
@media (prefers-reduced-motion: no-preference){.cell{transition:background-color .12s}}
</style>
</head>

<noscript><p style="padding:24px">이 앱은 JavaScript가 필요합니다. 브라우저 설정에서 JavaScript를 켜 주세요.</p></noscript>
<div role="note" style="background:#F8EBD2;color:#A9650A;border-bottom:1px solid #A9650A;padding:6px 16px;font:600 13px/1.4 system-ui,sans-serif">DEV 시험용 — 실제 직원 정보를 넣지 마세요</div>
<div id="root"></div>
<div id="live" class="sr" aria-live="polite"></div>

<script>
'use strict';
/* =====================================================================
 * AZMT 근태 통합 시스템 — 프런트엔드 (단계 7-3)
 * 범위: 본인 출퇴근·내 기록(7-2) + 지점·직원·근무코드 관리(7-3) · 로그인(휴대폰+PIN / 구글 병행) · 첫 로그인 PIN 변경 · 구글 계정 연결·해제
 * 서버: Code.gs v0.6 (text/plain POST, 본문 {action, token, params}, 응답 {ok, data | code, message})
 * 이후 단계(7-4~7-6)는 아래 TABS 의 render 함수를 채워 넣는 방식으로 붙인다.
 * ===================================================================== */

/* ---------- 설정: 배포 시 이 값만 바꾼다 ---------- */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbx0eoQbVp2m2pSN05ISDCXnV_sTjO8GP-t68fM1wG3bUCOtx28yXEqrjPM9Olh2RqhZVg/exec',                        // 예) https://script.google.com/macros/s/AKfycb.../exec
  REQUEST_TIMEOUT_MS: 20000,
  STORAGE_KEY: 'azmt_att_session_v1',
  VERSION: '7-6'
};

/* ---------- 공통 ---------- */
class ApiError extends Error {
  constructor(code, message, extra) {
    super(message);
    this.code = code;
    if (extra) Object.assign(this, extra);
  }
}
const ROLE_LABEL = { STAFF: '현장 인력', GM: '총지배인', HQ: '본사 담당자' };

function apiConfigured() {
  return typeof CONFIG.API_URL === 'string' && /^https:\/\/script\.google\.com\/macros\/s\/[^\s]+\/exec$/.test(CONFIG.API_URL);
}

/* 휴대폰: 서버(normalizePhone_)와 같은 규칙 — 숫자만, 10자리 '10…'이면 앞에 0 복원 */
function normalizePhone(v) {
  let d = String(v == null ? '' : v).replace(/\D/g, '');
  if (d.length === 10 && d.indexOf('10') === 0) d = '0' + d;
  return /^01[016789]\d{7,8}$/.test(d) ? d : '';
}
/* 약한 PIN: 서버(isWeakPin_)와 동일 규칙 */
function isWeakPin(pin) {
  if (/^(\d)\1+$/.test(pin)) return true;
  if ('01234567890123456789'.indexOf(pin) >= 0 || '98765432109876543210'.indexOf(pin) >= 0) return true;
  if (/^(\d{2})\1\1$/.test(pin) || /^(\d{3})\1$/.test(pin)) return true;
  return false;
}

/* ---------- 세션 (토큰은 이 기기에만 저장, 만료 시각 지나면 폐기) ---------- */
const Session = (function () {
  let mem = null; // localStorage 를 쓸 수 없는 환경(사생활 보호 모드 등) 대비
  function valid(s) {
    return !!s && typeof s.token === 'string' && s.token.length >= 32 &&
      Number.isFinite(s.expires_at) && !!s.user && typeof s.user === 'object';
  }
  function get() {
    let s = mem;
    if (!s) {
      try { s = JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEY) || 'null'); } catch (e) { s = null; }
    }
    if (!valid(s) || s.expires_at - 60000 <= Date.now()) { clear(); return null; }
    mem = s;
    return s;
  }
  function save(s) {
    mem = { token: s.token, expires_at: s.expires_at, user: s.user };
    try { localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(mem)); } catch (e) { /* 메모리 보관으로 계속 */ }
  }
  function updateUser(patch) {
    const s = get();
    if (!s) return;
    s.user = Object.assign({}, s.user, patch);
    save(s);
  }
  function clear() {
    mem = null;
    try { localStorage.removeItem(CONFIG.STORAGE_KEY); } catch (e) { /* 무시 */ }
  }
  return { get: get, save: save, updateUser: updateUser, clear: clear };
})();

/* ---------- API 클라이언트 ---------- */
const Api = { onAuthLost: null };

async function apiCall(action, params, opts) {
  opts = opts || {};
  const needAuth = opts.auth !== false;
  if (!apiConfigured()) throw new ApiError('CONFIG', '서버 주소가 설정되지 않았습니다. 관리자에게 문의해 주세요.');
  const sess = needAuth ? Session.get() : null;
  if (needAuth && !sess) throw new ApiError('AUTH', '로그인이 필요합니다.');

  const ctrl = new AbortController();
  const timer = setTimeout(function () { ctrl.abort(); }, CONFIG.REQUEST_TIMEOUT_MS);
  let resp, text;
  try {
    resp = await fetch(CONFIG.API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // preflight 방지(서버 규약)
      body: JSON.stringify({ action: action, token: sess ? sess.token : undefined, params: params || {} }),
      signal: ctrl.signal, cache: 'no-store', redirect: 'follow', credentials: 'omit'
    });
    text = await resp.text();
  } catch (e) {
    if (e && e.name === 'AbortError') {
      throw new ApiError('TIMEOUT', '서버 응답이 늦어지고 있습니다. 잠시 후 다시 시도해 주세요.', { uncertain: true });
    }
    throw new ApiError('NETWORK', '서버에 연결하지 못했습니다. 인터넷 연결을 확인한 뒤 다시 시도해 주세요.', { uncertain: true });
  } finally {
    clearTimeout(timer);
  }

  if (!resp.ok) {
    if (resp.status === 401 || resp.status === 403 || resp.status === 404) {
      throw new ApiError('DEPLOY', '서버에 접근할 수 없습니다. 서버 주소와 배포 설정(액세스: 모든 사용자)을 확인해 주세요.');
    }
    throw new ApiError('SERVER', '서버 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.');
  }
  let data;
  try { data = JSON.parse(text); } catch (e) {
    throw new ApiError('BAD_RESPONSE', '서버 응답을 읽지 못했습니다. 서버 배포 설정(액세스: 모든 사용자)을 확인해 주세요.');
  }
  if (!data || typeof data.ok !== 'boolean') throw new ApiError('BAD_RESPONSE', '서버 응답 형식이 올바르지 않습니다.');
  if (!data.ok) {
    const err = new ApiError(String(data.code || 'SERVER'), String(data.message || '요청을 처리하지 못했습니다.'));
    if (err.code === 'AUTH' && sess) {
      Session.clear();
      if (Api.onAuthLost) Api.onAuthLost(err.message);
    }
    throw err;
  }
  return data.data;
}

/* ---------- 구글 로그인 (선택 기능: 실패해도 휴대폰+PIN 로그인에는 영향 없음) ---------- */
const Google = (function () {
  let opts = null;     // { enabled, client_id }
  let loading = null;  // 스크립트 로딩 Promise
  let inited = false;
  let handler = null;  // 구글 버튼에서 ID 토큰이 돌아왔을 때 호출할 함수(화면마다 교체)
  function gsi() { return window.google && window.google.accounts && window.google.accounts.id ? window.google.accounts.id : null; }
  async function options() {
    if (opts) return opts;
    if (!apiConfigured()) return { enabled: false };
    try {
      const r = await apiCall('getAuthOptions', {}, { auth: false });
      const g = r && r.google;
      opts = (g && g.enabled === true && /^[A-Za-z0-9._-]+\.apps\.googleusercontent\.com$/.test(String(g.client_id || '')))
        ? { enabled: true, client_id: g.client_id } : { enabled: false };
    } catch (e) {
      return { enabled: false }; // 실패는 캐시하지 않고 다음 화면에서 다시 확인
    }
    return opts;
  }
  function load() {
    if (gsi()) return Promise.resolve(true);
    if (loading) return loading;
    loading = new Promise(function (resolve) {
      const s = document.createElement('script');
      let timer = null;
      const done = function (ok) {
        clearTimeout(timer);
        if (!ok) { loading = null; s.remove(); }
        resolve(ok);
      };
      timer = setTimeout(function () { done(false); }, 8000);
      s.src = 'https://accounts.google.com/gsi/client';
      s.async = true; s.defer = true;
      s.onload = function () { done(!!gsi()); };

      document.head.appendChild(s);
    });

  }
  /* 'ok' = 버튼 표시됨, 'off' = 구글 로그인 미사용, 'fail' = 구글 스크립트를 불러오지 못함 */
  async function renderButton(container, text) {
    const o = await options();
    if (!o.enabled) return 'off';
    const ok = await load();
    if (!ok) return 'fail';
    if (!container.isConnected) return 'off';
    if (!inited) {
      gsi().initialize({
        client_id: o.client_id, auto_select: false, cancel_on_tap_outside: true,
        callback: function (r) { if (handler && r && typeof r.credential === 'string') handler(r.credential); }
      });
      inited = true;
    }
    const w = Math.max(200, Math.min(400, Math.floor(container.clientWidth) || 280));
    gsi().renderButton(container, { type: 'standard', theme: 'outline', size: 'large', text: text || 'signin_with', shape: 'rectangular', locale: 'ko', width: w });
    return 'ok';

})();

/* ---------- DOM 도우미 (사용자·서버 데이터는 항상 textContent 로만 넣는다) ---------- */
function h(tag, attrs) {
  const el = document.createElement(tag);
  if (attrs) {
    Object.keys(attrs).forEach(function (k) {
      const v = attrs[k];
      if (v === false || v == null) return;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (v === true) el.setAttribute(k, '');
      else el.setAttribute(k, String(v));
    });
  }
  for (let i = 2; i < arguments.length; i++) appendKids(el, arguments[i]);
  return el;
}
function appendKids(el, c) {
  if (c == null || c === false) return;
  if (Array.isArray(c)) { c.forEach(function (x) { appendKids(el, x); }); return; }
  el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
}
const root = document.getElementById('root');
function mount(node) {
  Google.setHandler(null);
  root.replaceChildren(node);
  const f = node.querySelector('[data-autofocus]') || node.querySelector('h1');
  if (f) { if (!f.matches('input,button')) f.setAttribute('tabindex', '-1'); try { f.focus({ preventScroll: true }); } catch (e) { /* 무시 */ } }
}
function announce(msg) { document.getElementById('live').textContent = msg; }
function showMsg(el, text, kind) {
  el.className = 'msg ' + (kind || 'bad');
  el.textContent = text;
  el.hidden = false;
}
function friendly(e) {
  if (e instanceof ApiError) return e.message;
  console.error(e);
  return '알 수 없는 오류가 발생했습니다. 새로고침 후 다시 시도해 주세요.';
}

/* ---------- 세션 만료 타이머 ---------- */
let expiryTimer = null;
function stopExpiryTimer() { if (expiryTimer) { clearTimeout(expiryTimer); expiryTimer = null; } }
function startExpiryTimer() {
  stopExpiryTimer();
  const s = Session.get();
  if (!s) return;
  const ms = Math.min(Math.max(s.expires_at - Date.now() - 30000, 1000), 2147000000);
  expiryTimer = setTimeout(function () {
    Session.clear();
    showLogin('로그인 유지 시간이 지났습니다. 다시 로그인해 주세요.');
  }, ms);
}

/* ---------- 비밀번호(PIN) 입력 공통 ---------- */
function pinField(id, label, autocomplete, hint) {
  const input = h('input', {
    id: id, type: 'password', inputmode: 'numeric', pattern: '[0-9]*', maxlength: '6',
    autocomplete: autocomplete, required: true, class: 'mono', 'aria-describedby': hint ? id + '-hint' : false
  });
  return { input: input, wrap: h('div', { class: 'fld' }, h('label', { for: id }, label), input, hint ? h('div', { class: 'hint', id: id + '-hint' }, hint) : null) };
}
function revealToggle(inputs) {
  const b = h('button', {
    type: 'button', class: 'btn small', 'aria-pressed': 'false', style: 'margin-top:10px',
    onclick: function () {
      const show = b.getAttribute('aria-pressed') !== 'true';
      inputs.forEach(function (i) { i.type = show ? 'text' : 'password'; });
      b.setAttribute('aria-pressed', String(show));
      b.textContent = show ? 'PIN 숨기기' : 'PIN 보기';
    }
  }, 'PIN 보기');
  return b;
}

/* ===================== 화면: 로그인 ===================== */
function showLogin(notice) {
  stopExpiryTimer();
  const err = h('p', { id: 'login-err', role: 'alert', hidden: true });
  const phone = h('input', {
    id: 'phone', type: 'tel', inputmode: 'numeric', autocomplete: 'username', maxlength: '13',
    placeholder: '01012345678', required: true, class: 'mono', 'data-autofocus': '1'
  });
  const pin = pinField('pin', 'PIN (숫자 6자리)', 'current-password');
  const btn = h('button', { type: 'submit', class: 'btn primary block' }, '로그인');
  let busy = false;

  const form = h('form', {
    novalidate: true,
    onsubmit: async function (ev) {
      ev.preventDefault();
      if (busy) return;
      err.hidden = true; phone.removeAttribute('aria-invalid'); pin.input.removeAttribute('aria-invalid');
      const ph = normalizePhone(phone.value);
      if (!ph) { phone.setAttribute('aria-invalid', 'true'); showMsg(err, '휴대폰 번호를 확인해 주세요. (예: 01012345678)'); phone.focus(); return; }
      const pv = pin.input.value.trim();
      if (!/^\d{6}$/.test(pv)) { pin.input.setAttribute('aria-invalid', 'true'); showMsg(err, 'PIN은 숫자 6자리입니다.'); pin.input.focus(); return; }
      busy = true; btn.disabled = true; btn.textContent = '로그인 중…';
      try {
        const r = await apiCall('login', { phone: ph, pin: pv }, { auth: false });
        if (!r || typeof r.token !== 'string' || !Number.isFinite(r.expires_at) || !r.user || !r.user.role) {
          throw new ApiError('BAD_RESPONSE', '서버 응답 형식이 올바르지 않습니다.');
        }
        Session.save({ token: r.token, expires_at: r.expires_at, user: r.user });
        pin.input.value = '';
        route();
      } catch (e) {
        pin.input.value = '';
        showMsg(err, friendly(e));
        if (document.body.contains(pin.input)) pin.input.focus();
      } finally {
        busy = false; btn.disabled = false; btn.textContent = '로그인';
      }
    }
  },
    h('div', { class: 'fld' }, h('label', { for: 'phone' }, '휴대폰 번호'), phone),
    pin.wrap, revealToggle([pin.input]), err, btn);

  const gBtn = h('div', { class: 'gbtn', id: 'google-btn' });
  const gNote = h('p', { class: 'sub', id: 'google-note' }, '구글 계정을 미리 연결해 둔 경우에만 사용할 수 있어요. 처음이라면 위에서 PIN으로 로그인한 뒤 연결해 주세요.');
  const gWrap = h('div', { class: 'gwrap', hidden: true }, h('div', { class: 'or', 'aria-hidden': 'true' }, '또는'), gBtn, gNote);

  const card = h('main', { class: 'auth-card' },
    h('div', { class: 'brand' }, h('i'), 'AZMT'),
    h('h1', null, 'AZMT 근태 통합 시스템'),
    h('p', { class: 'sub' }, '휴대폰 번호와 PIN 6자리로 로그인합니다.'),
    notice ? h('p', { class: 'msg warn', role: 'status' }, notice) : null,
    !apiConfigured() ? h('p', { class: 'msg bad', role: 'alert' }, '서버 주소가 설정되지 않아 로그인할 수 없습니다. 관리자에게 문의해 주세요.') : null,
    form,
    gWrap,
    h('p', { class: 'foot' }, 'PIN을 모르거나 잠긴 경우 소속 지점 총지배인에게 요청해 주세요. 휴대폰 번호는 이 기기에 저장하지 않습니다.'),
    h('p', { class: 'ver' }, 'v' + CONFIG.VERSION));
  if (!apiConfigured()) btn.disabled = true;
  mount(h('div', { class: 'auth' }, card));

  /* 구글 로그인: 서버가 켜져 있을 때만 버튼을 보여준다. 어떤 실패도 PIN 로그인을 막지 않는다. */
  Google.setHandler(async function (credential) {
    if (busy) return;
    busy = true; btn.disabled = true; err.hidden = true;
    announce('구글 로그인 중입니다.');
    try {
      const r = await apiCall('loginGoogle', { id_token: credential }, { auth: false });
      if (!r || typeof r.token !== 'string' || !Number.isFinite(r.expires_at) || !r.user || !r.user.role) {
        throw new ApiError('BAD_RESPONSE', '서버 응답 형식이 올바르지 않습니다.');
      }
      Session.save({ token: r.token, expires_at: r.expires_at, user: r.user });
      pin.input.value = '';
      route();
    } catch (e) {
      showMsg(err, friendly(e));
    } finally {
      busy = false; btn.disabled = !apiConfigured();
    }
  });
  Google.options().then(function (o) {
    if (!o.enabled || !gWrap.isConnected) return;
    gWrap.hidden = false;
    return Google.renderButton(gBtn, 'signin_with').then(function (st) {
      if (st === 'fail' && gWrap.isConnected) {
        gBtn.replaceChildren();
        gNote.textContent = '구글 로그인을 불러오지 못했어요. 휴대폰 번호와 PIN으로 로그인해 주세요.';
      }
    });
  }).catch(function (e) { console.error(e); });
}

/* ===================== 화면: PIN 변경 (강제/자발) ===================== */
let flash = '';
function showChangePin(forced) {
  const err = h('p', { id: 'pin-err', role: 'alert', hidden: true });
  const f1 = pinField('old-pin', forced ? '임시 PIN (받은 6자리)' : '현재 PIN', 'current-password');
  const f2 = pinField('new-pin', '새 PIN (숫자 6자리)', 'new-password', '연속(123456)·반복(111111, 121212)·휴대폰 번호 뒤 6자리는 사용할 수 없어요.');
  const f3 = pinField('new-pin2', '새 PIN 확인', 'new-password');
  f1.input.setAttribute('data-autofocus', '1');
  const btn = h('button', { type: 'submit', class: 'btn primary block' }, 'PIN 변경');
  let busy = false;

  const form = h('form', {
    novalidate: true,
    onsubmit: async function (ev) {
      ev.preventDefault();
      if (busy) return;
      err.hidden = true;
      [f1, f2, f3].forEach(function (f) { f.input.removeAttribute('aria-invalid'); });
      const o = f1.input.value.trim(), n = f2.input.value.trim(), n2 = f3.input.value.trim();
      const bad = function (f, m) { f.input.setAttribute('aria-invalid', 'true'); showMsg(err, m); f.input.focus(); };
      if (!/^\d{6}$/.test(o)) return bad(f1, '현재 PIN은 숫자 6자리입니다.');
      if (!/^\d{6}$/.test(n)) return bad(f2, '새 PIN은 숫자 6자리여야 해요.');
      if (n === o) return bad(f2, '현재 PIN과 다른 PIN을 입력해 주세요.');
      if (isWeakPin(n)) return bad(f2, '연속되거나 반복되는 숫자는 사용할 수 없어요.');
      if (n !== n2) return bad(f3, '새 PIN 확인이 일치하지 않아요.');
      busy = true; btn.disabled = true; btn.textContent = '변경 중…';
      try {
        await apiCall('changePin', { old_pin: o, new_pin: n });
        Session.updateUser({ pin_must_change: false });
        flash = 'PIN을 변경했어요. 다른 기기에서 로그인한 상태는 종료됩니다.';
        route();
      } catch (e) {
        [f1, f2, f3].forEach(function (f) { f.input.value = ''; });
        if (e instanceof ApiError && e.code === 'LOCKED') { Session.clear(); showLogin(e.message); return; }
        if (e instanceof ApiError && e.code === 'AUTH') return; // onAuthLost 가 로그인 화면으로 이동시킴
        let m = friendly(e);
        if (e instanceof ApiError && e.uncertain) m += ' 변경이 이미 처리되었을 수 있으니, 안 되면 새 PIN으로 다시 로그인해 보세요.';
        showMsg(err, m);
        f1.input.focus();
      } finally {
        busy = false; btn.disabled = false; btn.textContent = 'PIN 변경';
      }
    }
  }, f1.wrap, f2.wrap, f3.wrap, revealToggle([f1.input, f2.input, f3.input]), err, btn);

  const card = h('main', { class: 'auth-card' },
    h('div', { class: 'brand' }, h('i'), 'AZMT'),
    h('h1', null, forced ? '새 PIN을 정해 주세요' : 'PIN 변경'),
    h('p', { class: 'sub' }, forced ? '임시 PIN으로 로그인했어요. 본인만 아는 PIN으로 바꿔야 계속 사용할 수 있어요.' : '현재 PIN을 확인한 뒤 새 PIN으로 바꿉니다.'),
    form,
    forced ? h('button', { type: 'button', class: 'btn small', style: 'margin-top:12px', onclick: function () { doLogout(); } }, '로그아웃')
      : h('button', { type: 'button', class: 'btn small', style: 'margin-top:12px', onclick: function () { route(); } }, '취소'));
  mount(h('div', { class: 'auth' }, card));
}

/* 구글 계정 연결·해제 카드. 구글 로그인이 꺼져 있고 연결도 없으면 표시하지 않는다. */
function googleCard(user) {
  const body = h('div', null);
  const card = h('section', { class: 'card', hidden: true, id: 'google-card' }, h('h2', null, '구글 계정으로 로그인'), body);

  function showLinked() {
    const msg = h('p', { role: 'alert', hidden: true });
    const confirmRow = h('div', { hidden: true },
      h('p', { class: 'msg warn' }, user.login_method === 'GOOGLE'
        ? '연결을 해제하면 지금 로그인한 상태도 종료돼요. 이후에는 휴대폰 번호와 PIN으로 로그인해야 해요.'
        : '연결을 해제하면 구글 버튼으로 로그인할 수 없어요. 휴대폰 번호와 PIN으로는 계속 로그인할 수 있어요.'));

      type: 'button', class: 'btn small', style: 'margin-top:10px',
      onclick: async function () {
        if (busy) return;
        busy = true; doBtn.disabled = true; msg.hidden = true;
        try {
          await apiCall('unlinkGoogle', {});
          if (user.login_method === 'GOOGLE') { Session.clear(); showLogin('구글 연결을 해제했어요. 휴대폰 번호와 PIN으로 로그인해 주세요.'); return; }
          Session.updateUser({ google_linked: false, google_email: '' });
          flash = '구글 계정 연결을 해제했어요.';
          showShell();
        } catch (e) {
          if (handleCommonError(e)) return;
          showMsg(msg, friendly(e));
        } finally {
          busy = false; doBtn.disabled = false;
        }
      }
    }, '해제하기');
    const askBtn = h('button', {
      type: 'button', class: 'btn small', style: 'margin-top:10px',
      onclick: function () { confirmRow.hidden = false; askBtn.hidden = true; doBtn.focus(); }
    }, '연결 해제');
    confirmRow.append(doBtn, h('button', { type: 'button', class: 'btn small', style: 'margin:10px 0 0 8px', onclick: function () { confirmRow.hidden = true; askBtn.hidden = false; askBtn.focus(); } }, '취소'));
    body.replaceChildren(
      h('p', null, '연결된 구글 계정: ', h('b', { class: 'mono' }, user.google_email || '-')),
      h('p', { class: 'sub', style: 'margin-top:4px' }, '로그인 화면의 구글 버튼으로 PIN 없이 들어올 수 있어요.'),
      askBtn, confirmRow, msg);
  }

  function showUnlinked() {
    const msg = h('p', { role: 'alert', hidden: true });
    const pinF = pinField('link-pin', '현재 PIN (본인 확인)', 'current-password');
    const gBtn = h('div', { class: 'gbtn', style: 'margin-top:14px' });
    const note = h('p', { class: 'sub', style: 'margin-top:8px' });
    let busy = false;
    body.replaceChildren(
      h('p', { class: 'sub' }, '구글 계정을 연결하면 PIN 입력 없이 구글 버튼으로 로그인할 수 있어요. 연결하면 해당 구글 계정의 이메일 주소가 본인 확인용으로 저장돼요. PIN 로그인도 계속 사용할 수 있어요.'),
      pinF.wrap, gBtn, note, msg);
    Google.setHandler(async function (credential) {
      if (busy) return;
      msg.hidden = true; pinF.input.removeAttribute('aria-invalid');
      const pv = pinF.input.value.trim();
      if (!/^\d{6}$/.test(pv)) {
        pinF.input.setAttribute('aria-invalid', 'true');
        showMsg(msg, '먼저 위 칸에 현재 PIN 6자리를 입력한 뒤, 구글 버튼을 눌러 주세요.');
        pinF.input.focus();
        return;
      }
      busy = true;
      announce('구글 계정을 연결하는 중입니다.');
      try {
        const r = await apiCall('linkGoogle', { id_token: credential, pin: pv });
        Session.updateUser({ google_linked: true, google_email: (r && r.google_email) || '' });
        flash = '구글 계정을 연결했어요. 다음부터 로그인 화면의 구글 버튼으로 들어올 수 있어요.';
        showShell();

      if (!r || !Array.isArray(r.branches)) throw new ApiError('BAD_RESPONSE', '서버 응답 형식이 올바르지 않습니다.');
      if (!r.branches.length) {
        body.replaceChildren(h('p', { class: 'msg warn', style: 'margin-top:8px' }, ctx.user.role === 'HQ'
          ? '등록된 지점이 없어요. 위쪽 메뉴의 \'지점\'에서 먼저 등록해 주세요.'
          : '소속 지점 정보를 찾을 수 없어요. 본사에 문의해 주세요.'));
        return;
      }
      body.replaceChildren(h('div', { class: 'scroll' }, h('table', { class: 't' },
        h('thead', null, h('tr', null, h('th', null, '지점'), h('th', null, '허용 반경'), h('th', null, '상태'))),
        h('tbody', null, r.branches.map(function (b) {
          return h('tr', null, h('td', null, b.name), h('td', { class: 'mono' }, b.radius_m + 'm'),
            h('td', null, h('span', { class: 'pill' + (b.status === 'ACTIVE' ? '' : ' off') }, b.status === 'ACTIVE' ? '운영' : '중지')));
        })))));
    }).catch(function (e) {
      if (!ctx.isCurrent() || handleCommonError(e)) return;
      body.replaceChildren(h('p', { class: 'msg bad', role: 'alert', style: 'margin-top:8px' }, friendly(e)),
        h('button', { type: 'button', class: 'btn small', style: 'margin-top:10px', onclick: load }, '다시 시도'));
    });
  };
  load();
}

/* ===================== 7-2: 출퇴근 · 내 기록 ===================== */
/* 시각은 서버가 KST(+09:00)로 기록한 문자열을 그대로 읽는다. 기기 시간대와 무관하게 표시하기 위해 Date 의 지역 시각은 쓰지 않는다. */
const DOW = ['일', '월', '화', '수', '목', '금', '토'];
const pad2 = function (n) { return ('0' + n).slice(-2); };
function kstParts(ms) {
  const d = new Date(ms + 9 * 3600000);
  return { y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate(), hh: d.getUTCHours(), mm: d.getUTCMinutes() };
}
function kstTodayStr() { const p = kstParts(Date.now()); return p.y + '-' + pad2(p.m) + '-' + pad2(p.d); }
function okDate(d) { return typeof d === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(d); }
function dowOf(dateStr) { return okDate(dateStr) ? DOW[new Date(dateStr + 'T00:00:00Z').getUTCDay()] : ''; }
function fmtDateLabel(dateStr) { if (!okDate(dateStr)) return ''; return parseInt(dateStr.slice(5, 7), 10) + '월 ' + parseInt(dateStr.slice(8, 10), 10) + '일 (' + dowOf(dateStr) + ')'; }
function fmtShortDate(dateStr) { if (!okDate(dateStr)) return '-'; return dateStr.slice(5, 7) + '/' + dateStr.slice(8, 10) + ' (' + dowOf(dateStr) + ')'; }
function fmtHM(iso) { const m = /T(\d{2}:\d{2})/.exec(String(iso || '')); return m ? m[1] : '-'; }
function fmtDur(min) {
  if (min == null || !Number.isFinite(min) || min < 0) return '-';
  const hh = Math.floor(min / 60), mm = min % 60;
  return hh ? hh + '시간 ' + pad2(mm) + '분' : mm + '분';
}
function addMonthStr(ym, n) {
  const d = new Date(Date.UTC(parseInt(ym.slice(0, 4), 10), parseInt(ym.slice(5, 7), 10) - 1 + n, 1));
  return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1);
}
function daysOfMonth(ym) {
  const n = new Date(Date.UTC(parseInt(ym.slice(0, 4), 10), parseInt(ym.slice(5, 7), 10), 0)).getUTCDate();
  const out = [];
  for (let i = 1; i <= n; i++) out.push(ym + '-' + pad2(i));
  return out;
}
const LEAVE_LABEL = { ANNUAL: '연차', SICK: '병가', OFFICIAL: '공가' };
function daySnapLabel(day) {
  const s = day && day.snapshot;
  if (!s) return day && day.code ? day.code : '';
  if (s.type === 'OFF') return '휴무';
  if (s.type === 'LEAVE') return s.leave_kind === 'HALF' ? (s.leave_unit === 'AM' ? '오전 반차' : '오후 반차') : (LEAVE_LABEL[s.leave_kind] || '휴가');
  if (s.type === 'WORK') return day.code + ' ' + (s.start || '') + '–' + (s.end || '');
  return day.code || '';
}
const REASON_LABEL = { OUT_OF_RANGE: '위치 반경 밖', LOW_ACCURACY: 'GPS 정확도 낮음', NO_APPROVED_PLAN: '승인 전 계획' };

/* 현재 위치 한 번 읽기. 실패는 안내 문구와 함께 ApiError 로 돌려준다. */
function getPosition() {
  return new Promise(function (resolve, reject) {
    if (!window.isSecureContext && location.protocol !== 'https:' && location.hostname !== 'localhost') {
      reject(new ApiError('GEO', '보안 연결(https)에서만 위치를 확인할 수 있어요. 안내받은 주소로 접속했는지 확인해 주세요.')); return;
    }
    if (!navigator.geolocation) {
      reject(new ApiError('GEO', '이 브라우저는 위치 확인을 지원하지 않아요. 다른 브라우저로 접속해 주세요.')); return;
    }
    navigator.geolocation.getCurrentPosition(function (p) {
      const c = p && p.coords;
      if (!c || !Number.isFinite(c.latitude) || !Number.isFinite(c.longitude) || !Number.isFinite(c.accuracy)) {
        reject(new ApiError('GEO', '위치 값을 읽지 못했어요. 잠시 후 다시 눌러 주세요.')); return;
      }
      resolve({ lat: c.latitude, lng: c.longitude, accuracy: c.accuracy });
    }, function (err) {
      const code = err && err.code;
      if (code === 1) reject(new ApiError('GEO', '위치 권한이 꺼져 있어요. 브라우저의 사이트 설정에서 위치를 허용한 뒤 다시 눌러 주세요.'));
      else if (code === 3) reject(new ApiError('GEO', '위치 확인이 오래 걸리고 있어요. 잠시 후 다시 눌러 주세요.'));
      else reject(new ApiError('GEO', '현재 위치를 찾지 못했어요. 실내라면 창가 근처로 이동하거나 휴대폰의 위치(GPS)를 켠 뒤 다시 눌러 주세요.'));
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
  });
}

function errBlock(e, retry) {
  return h('div', null, h('p', { class: 'msg bad', role: 'alert', style: 'margin-top:0' }, friendly(e)),
    h('button', { type: 'button', class: 'btn small', style: 'margin-top:10px', onclick: retry }, '다시 시도'));
}

/* 출퇴근 직후 안내. 위치 이탈·정확도는 '기록은 됐고 확인 대상' 이라는 톤으로, 직원에게 책임을 묻지 않는다. */
function resultNotice(kind, r) {
  const rec = (r && r.record) || {};
  const isIn = kind === 'in';
  const t = fmtHM(isIn ? rec.in_at : rec.out_at);
  const flag = String((isIn ? rec.in_flag : rec.out_flag) || '');
  const dist = isIn ? rec.in_dist_m : rec.out_dist_m;
  const notes = [];
  if (flag.indexOf('OUT_OF_RANGE') >= 0) notes.push('위치가 지점 허용 반경 밖으로 확인됐어요' + (Number.isFinite(dist) ? ' (약 ' + dist + 'm)' : '') + '.');
  if (flag.indexOf('LOW_ACCURACY') >= 0) notes.push('GPS 정확도가 낮게 측정됐어요.');
  if (isIn && rec.plan_state === 'UNAPPROVED') notes.push('이번 달 근무 계획이 아직 승인 전이에요.');
  const base = t + ' ' + (isIn ? '출근' : '퇴근') + '을 기록했어요.';
  return notes.length
    ? { kind: 'warn', text: base + ' ' + notes.join(' ') + ' 기록은 정상 저장되었고, 총지배인이 확인합니다.' }
    : { kind: 'ok', text: base };
}

function renderClock(host, ctx) {
  const wrap = h('div', { class: 'stack' });
  host.append(wrap);
  let busy = false;
  let notice = null;
  let timer = null;
  const stopTimer = function () { if (timer) { clearInterval(timer); timer = null; } };

  function consentBlock() {
    const box = h('section', { class: 'card' }, h('h2', null, '위치정보 수집·이용 동의'), h('p', { class: 'sub' }, '불러오는 중…'));
    apiCall('getConsent').then(function (c) {
      if (!ctx.isCurrent()) return;
      if (!c || !Array.isArray(c.items) || !c.version) throw new ApiError('BAD_RESPONSE', '서버 응답 형식이 올바르지 않습니다.');
      const err = h('p', { role: 'alert', hidden: true });
      const chk = h('input', { type: 'checkbox', id: 'consent-ok', style: 'width:20px;height:20px;margin:0' });
      const go = h('button', { type: 'button', class: 'btn primary block', disabled: true }, '동의하고 시작하기');
      let cbusy = false;
      chk.addEventListener('change', function () { go.disabled = !chk.checked; });
      go.addEventListener('click', async function () {
        if (cbusy || !chk.checked) return;
        cbusy = true; go.disabled = true; err.hidden = true;
        try {
          await apiCall('recordConsent', { version: c.version, agree: true });
          notice = { kind: 'ok', text: '동의가 기록되었어요. 이제 출퇴근을 기록할 수 있어요.' };
          cbusy = false;
          if (ctx.isCurrent()) load();
        } catch (e) {
          cbusy = false; go.disabled = !chk.checked;
          if (handleCommonError(e)) return;
          if (e instanceof ApiError && e.code === 'CONSENT_VERSION') { notice = { kind: 'warn', text: e.message }; if (ctx.isCurrent()) load(); return; }
          showMsg(err, friendly(e));
        }
      });
      box.replaceChildren(
        h('h2', null, c.title || '위치정보 수집·이용 동의'),
        h('p', { class: 'sub' }, '출퇴근을 앱으로 기록하려면 아래 내용에 동의가 필요해요.'),
        h('dl', { class: 'dl', style: 'grid-template-columns:96px 1fr' },
          c.items.map(function (it) { return [h('dt', null, it.head), h('dd', null, it.body)]; })),
        h('label', { for: 'consent-ok', style: 'display:flex;gap:10px;align-items:center;margin-top:16px;min-height:44px' }, chk, '위 내용을 확인했고 동의합니다.'),
        err, go);
    }).catch(function (e) {
      if (!ctx.isCurrent() || handleCommonError(e)) return;
      box.replaceChildren(h('h2', null, '위치정보 수집·이용 동의'), errBlock(e, function () { load(); }));
    });
    return box;
  }

  async function act(kind, btn) {
    if (busy) return;
    busy = true; btn.disabled = true; btn.textContent = '위치 확인 중…';
    announce('위치를 확인하고 있어요.');
    try {
      const g = await getPosition();
      btn.textContent = kind === 'in' ? '출근 기록 중…' : '퇴근 기록 중…';
      const r = await apiCall(kind === 'in' ? 'clockIn' : 'clockOut', g);
      notice = resultNotice(kind, r);
    } catch (e) {
      if (handleCommonError(e)) { busy = false; return; }
      notice = { kind: 'bad', text: friendly(e) + (e && e.uncertain ? ' 기록되었는지 아래 상태를 먼저 확인해 주세요.' : '') };
    }
    busy = false;
    if (ctx.isCurrent()) load();
  }

  async function load() {
    stopTimer();
    let t;
    try { t = await apiCall('getMyToday'); } catch (e) {
      if (!ctx.isCurrent() || handleCommonError(e)) return;
      wrap.replaceChildren(errBlock(e, load));
      return;
    }
    if (!ctx.isCurrent()) return;
    if (!t || typeof t !== 'object' || !t.today || !t.server_time) { wrap.replaceChildren(errBlock(new ApiError('BAD_RESPONSE', '서버 응답 형식이 올바르지 않습니다.'), load)); return; }
    try { draw(t); } catch (e) {
      console.error(e);
      wrap.replaceChildren(errBlock(new ApiError('BAD_RESPONSE', '화면을 표시하지 못했어요. 잠시 후 다시 시도해 주세요.'), load));
    }
  }

  function draw(t) {
    const offset = Date.parse(t.server_time) - Date.now();
    const nodes = [];
    if (notice) { nodes.push(h('p', { class: 'msg ' + notice.kind, role: 'status', style: 'margin-top:0' }, notice.text)); announce(notice.text); notice = null; }

    if (t.block_reason === 'CONSENT_REQUIRED') {
      nodes.push(h('p', { class: 'sub' }, fmtDateLabel(t.today)));
      nodes.push(consentBlock());
      wrap.replaceChildren.apply(wrap, nodes);
      return;
    }

    const open = t.open_record;
    const working = !!(open && !open.stale && t.can_clock_out);
    const rec = t.record;
    const done = !!(rec && !rec.open);
    const sched = t.schedule || {};
    const snap = sched.day && sched.day.snapshot;

    const clockEl = h('div', { class: 'bigtime mono', 'aria-hidden': 'true' });
    const tick = function () { const p = kstParts(Date.now() + offset); clockEl.textContent = pad2(p.hh) + ':' + pad2(p.mm); };
    tick();
    const lampCls = working ? 'lamp on' : done ? 'lamp done' : 'lamp';
    const stateText = h('div', { class: 'state-text' });
    const paintState = function () {
      if (working) {
        const base = Date.parse(open.in_at);
        const el = Number.isFinite(base) ? Math.max(0, Math.round((Date.now() + offset - base) / 60000)) : null;
        stateText.textContent = (open.work_date !== t.today ? fmtShortDate(open.work_date) + ' ' : '') + fmtHM(open.in_at) + ' 출근 · 근무 중' + (el != null ? ' (' + fmtDur(el) + ' 경과)' : '');
      } else if (done) {
        stateText.textContent = fmtHM(rec.in_at) + ' 출근 · ' + fmtHM(rec.out_at) + ' 퇴근 (' + fmtDur(rec.work_min) + ')';
      } else {
        stateText.textContent = '오늘 출근 전이에요';
      }
    };
    paintState();
    timer = setInterval(function () {
      if (!clockEl.isConnected) { stopTimer(); return; }
      tick(); paintState();
    }, 20000);

    let schedLine = '오늘 근무 일정이 아직 확정되지 않았어요.';
    if (sched.state === 'APPROVED') {
      if (snap && snap.type === 'WORK') schedLine = '오늘 근무: ' + daySnapLabel(sched.day) + (snap.net_min != null ? ' · 실근무 ' + fmtDur(snap.net_min) : '');
      else if (snap) schedLine = '오늘은 ' + daySnapLabel(sched.day) + '이에요.';
      else schedLine = '오늘은 근무 계획이 없어요.';
    }

    nodes.push(h('section', { class: 'card clockcard' },
      h('div', { class: 'sub' }, fmtDateLabel(t.today) + (t.branch ? ' · ' + t.branch.name : '')),
      clockEl,
      h('div', { class: 'state-row' }, h('span', { class: lampCls, 'aria-hidden': 'true' }), stateText),
      h('p', { class: 'sub', style: 'margin-top:6px' }, schedLine)));

    // 안내/차단 메시지
    if (t.block_reason === 'BRANCH') nodes.push(h('p', { class: 'msg warn' }, '소속 지점이 운영 중이 아니라 출퇴근을 기록할 수 없어요. 총지배인에게 문의해 주세요.'));
    if (open && open.stale) nodes.push(h('p', { class: 'msg warn' }, fmtShortDate(open.work_date) + ' 출근 기록이 아직 퇴근 처리되지 않았어요. 시간이 많이 지나 앱에서는 처리할 수 없으니 총지배인에게 정정을 요청해 주세요.'));
    if (open && !open.stale && open.work_date !== t.today) nodes.push(h('p', { class: 'msg info' }, fmtShortDate(open.work_date) + ' 출근 기록이 아직 퇴근 전이에요. 먼저 퇴근을 기록해 주세요.'));
    if (t.block_reason === 'NOT_SCHEDULED') {
      nodes.push(h('p', { class: 'msg info' }, (snap && snap.type === 'OFF' ? '오늘은 휴무일이라 출근을 기록할 수 없어요.' : snap && snap.type === 'LEAVE' ? '오늘은 휴가로 등록되어 있어요.' : '오늘 근무 계획이 없어요.') + ' 근무가 필요했다면 총지배인에게 문의해 주세요.'));
    }
    if (sched.state === 'UNAPPROVED' && (t.can_clock_in || working)) nodes.push(h('p', { class: 'msg info' }, '이번 달 근무 계획이 아직 승인되지 않았어요. 출퇴근은 기록되며 총지배인이 확인합니다.'));

    // 버튼
    if (working || t.can_clock_in) {
      const kind = working ? 'out' : 'in';
      const btn = h('button', { type: 'button', class: 'btn primary clockbtn', id: 'clock-btn', 'data-autofocus': '1' }, working ? '퇴근하기' : '출근하기');
      btn.addEventListener('click', function () { act(kind, btn); });
      nodes.push(btn);
      nodes.push(h('p', { class: 'sub', style: 'text-align:center' }, '버튼을 누르는 순간의 위치를 한 번만 확인해요. 기록 시각은 서버 시계 기준이에요.' + (t.branch ? ' (허용 반경 ' + t.branch.radius_m + 'm)' : '')));
    }

    // 동의 철회
    if (t.consent_ok) {
      const row = h('div', { hidden: true },
        h('p', { class: 'msg warn' }, '철회하면 앱으로 출퇴근을 기록할 수 없고, 총지배인이 사유를 남기고 수기로 기록해요. 이미 기록된 내용은 보관 기간 동안 유지돼요.'));
      let wbusy = false;
      const yes = h('button', { type: 'button', class: 'btn small', style: 'margin-top:10px' }, '철회하기');
      const ask = h('button', { type: 'button', class: 'btn small' }, '위치정보 동의 철회');
      ask.addEventListener('click', function () { row.hidden = false; ask.hidden = true; yes.focus(); });
      yes.addEventListener('click', async function () {
        if (wbusy) return;
        wbusy = true; yes.disabled = true;
        try {
          await apiCall('withdrawConsent');
          notice = { kind: 'info', text: '위치정보 동의를 철회했어요.' };
        } catch (e) {
          if (handleCommonError(e)) { wbusy = false; return; }
          notice = { kind: 'bad', text: friendly(e) };
        }
        wbusy = false;
        if (ctx.isCurrent()) load();
      });
      row.append(yes, h('button', { type: 'button', class: 'btn small', style: 'margin:10px 0 0 8px', onclick: function () { row.hidden = true; ask.hidden = false; ask.focus(); } }, '취소'));
      nodes.push(h('div', { style: 'margin-top:6px' }, ask, row));
    }
    wrap.replaceChildren.apply(wrap, nodes);
    const f = wrap.querySelector('#clock-btn');
    if (f) { try { f.focus({ preventScroll: true }); } catch (e) { /* 무시 */ } }
  }

  wrap.append(h('p', { class: 'sub' }, '불러오는 중…'));
  load();
}

function statusPills(r, todayStr) {
  const out = [];
  if (r.open) out.push(h('span', { class: 'pill warn' }, r.work_date === todayStr ? '근무 중' : '퇴근 미기록'));
  if (r.late === true) out.push(h('span', { class: 'pill warn' }, '지각'));
  if (r.review_status === 'PENDING') out.push(h('span', { class: 'pill warn', title: (r.review_reasons || []).map(function (x) { return REASON_LABEL[x] || x; }).join(', ') }, '확인 대기'));
  else if (r.review_status === 'CONFIRMED') out.push(h('span', { class: 'pill' }, '확인됨'));
  else if (!r.open) out.push(h('span', { class: 'pill' }, '정상'));
  return out;
}

function renderMine(host, ctx) {
  const wrap = h('div', { class: 'stack' });
  host.append(wrap);
  const today = kstTodayStr();
  const curYm = today.slice(0, 7);
  let ym = curYm;
  const body = h('div', null);
  const label = h('b', { class: 'mono', 'aria-live': 'polite' });
  const prev = h('button', { type: 'button', class: 'btn small', 'aria-label': '이전 달' }, '‹');
  const next = h('button', { type: 'button', class: 'btn small', 'aria-label': '다음 달' }, '›');
  prev.addEventListener('click', function () { ym = addMonthStr(ym, -1); load(); });
  next.addEventListener('click', function () { ym = addMonthStr(ym, 1); load(); });
  wrap.append(h('section', { class: 'card' },
    h('div', { style: 'display:flex;align-items:center;justify-content:space-between;gap:8px' }, prev, label, next), body));

    prev.disabled = ym <= addMonthStr(curYm, -12);

    body.replaceChildren(h('p', { class: 'sub', style: 'margin-top:12px' }, '불러오는 중…'));
    try {
      const res = await Promise.all([apiCall('listMyAttendance', { ym: ym }), apiCall('getMySchedule', { ym: ym })]);
      if (!ctx.isCurrent() || my !== seq) return;
      const a = res[0], s = res[1];
      if (!a || !Array.isArray(a.records) || !s || !Array.isArray(s.days)) throw new ApiError('BAD_RESPONSE', '서버 응답 형식이 올바르지 않습니다.');
      draw(a.records, s);
    } catch (e) {
      if (!(e instanceof ApiError)) { console.error(e); e = new ApiError('BAD_RESPONSE', '화면을 표시하지 못했어요. 잠시 후 다시 시도해 주세요.'); }
      if (!ctx.isCurrent() || my !== seq || handleCommonError(e)) return;
      body.replaceChildren(errBlock(e, load));
    }
  }

  function draw(records, sched) {
    const recBy = {}; records.forEach(function (r) { recBy[r.work_date] = r; });
    const dayBy = {}; sched.days.forEach(function (d) { dayBy[d.date] = d; });
    const rows = [];
    let workDays = 0, totalMin = 0;
    daysOfMonth(ym).forEach(function (d) {
      const r = recBy[d], day = dayBy[d];
      if (!r && !day) return;
      if (r && Number.isFinite(r.work_min)) { workDays++; totalMin += r.work_min; }
      let state;
      if (r) state = h('span', null, statusPills(r, today));
      else if (day && day.snapshot && day.snapshot.type === 'WORK') state = h('span', { class: 'pill off' }, d < today ? '기록 없음' : d === today ? '오늘 예정' : '예정');
      else state = h('span', { class: 'sub' }, '');
      rows.push(h('tr', null,
        h('td', { class: 'mono' }, fmtShortDate(d)),
        h('td', null, day ? daySnapLabel(day) : (r && r.plan_state === 'EXCEPTION' ? '계획 외' : '')),
        h('td', { class: 'mono' }, r ? fmtHM(r.in_at) + '–' + (r.out_at ? fmtHM(r.out_at) : '') : '',

        h('td', null, state)));
    });
    const note = sched.plan_status && sched.plan_status !== 'APPROVED'
      ? h('p', { class: 'msg info' }, '이 달 근무 계획이 아직 승인 전이라 일정은 표시되지 않아요.') : null;
    if (!rows.length) {
      body.replaceChildren.apply(body, [note, h('p', { class: 'sub', style: 'margin-top:12px' }, ym === curYm ? '이번 달 표시할 근무 일정이나 기록이 아직 없어요.' : '이 달에는 표시할 근무 일정이나 기록이 없어요.')].filter(Boolean));
      return;
    }
    body.replaceChildren.apply(body, [note,
      h('p', { class: 'sub', style: 'margin-top:12px' }, '퇴근까지 기록된 날 ' + workDays + '일 · 합계 ' + fmtDur(totalMin)),
      h('div', { class: 'scroll' }, h('table', { class: 't' },
        h('thead', null, h('tr', null, ['날짜', '근무', '출근–퇴근', '상태'].map(function (x) { return h('th', null, x); }))),
        h('tbody', null, rows)))].filter(Boolean));
  }

  load();
}

function cleanText(v) { return String(v == null ? '' : v).replace(/\s+/g, ' ').trim(); }
/* 서버 sanitizeText_ 와 같은 규칙. 문제가 없으면 '' */
function textProblem(s, label, min, max) {
  if (s.length < min || s.length > max) return label + '은(는) ' + min + '~' + max + '자로 입력해 주세요.';
  if (/[\u0000-\u001f\u007f]/.test(s) || /^[=+\-@]/.test(s)) return label + '에 사용할 수 없는 문자가 있어요.';
  return '';
}
function fmtPhone(d) {

  if (/^\d{11}$/.test(d)) return d.replace(/(\d{3})(\d{4})(\d{4})/, '$1-$2-$3');
  if (/^\d{10}$/.test(d)) return d.replace(/(\d{3})(\d{3})(\d{4})/, '$1-$2-$3');
  return d;
}
function copyText(t) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t).then(function () { return true; }, function () { return false; });
  } catch (e) { /* 아래에서 false */ }

  return new ApiError('BAD_RESPONSE', '화면을 표시하지 못했어요. 잠시 후 다시 시도해 주세요.');
}
/* 되돌리기 어려운 동작용 인라인 확인. 첫 버튼을 누르면 확인 문구가 나타나고, 한 번 더 눌러야 실행된다. */
function confirmAction(label, question, run) {
  let busy = false;
  const ask = h('button', { type: 'button', class: 'btn small' }, label);
  const yes = h('button', { type: 'button', class: 'btn small primary' }, '확인');
  const no = h('button', { type: 'button', class: 'btn small' }, '취소');
  const panel = h('span', { class: 'acts', hidden: true }, h('span', { class: 'sub' }, question), yes, no);
  ask.addEventListener('click', function () { ask.hidden = true; panel.hidden = false; yes.focus(); });
  no.addEventListener('click', function () { panel.hidden = true; ask.hidden = false; ask.focus(); });
  yes.addEventListener('click', async function () {
    if (busy) return;
    busy = true; yes.disabled = true; no.disabled = true;
    try { await run(); } finally { busy = false; yes.disabled = false; no.disabled = false; panel.hidden = true; ask.hidden = false; }
  });
  return h('span', { class: 'acts' }, ask, panel);
}

/* 구글맵 좌표 붙여넣기 해석: "38.2, 128.5" · 구글맵 주소(@위도,경도 / !3d..!4d.. / q=위도,경도) */
function checkGeo(lat, lng) {
  if (!Number.isFinite(lat) || !Number.isFinite(lng)) return { error: '위도·경도는 숫자로 입력해 주세요.' };
  if (lat >= 33 && lat <= 39 && lng >= 124 && lng <= 132) return { lat: lat, lng: lng };
  if (lng >= 33 && lng <= 39 && lat >= 124 && lat <= 132) return { error: '위도와 경도의 순서가 바뀐 것 같아요. 위도(33~39)가 앞, 경도(124~132)가 뒤예요.' };
  return { error: '국내 좌표 범위를 벗어났어요. 위도 33~39, 경도 124~132 사이여야 해요.' };
}
function parseCoords(raw) {
  const s = String(raw == null ? '' : raw).trim();
  if (!s) return { error: '구글맵 좌표를 붙여 넣어 주세요. (예: 38.2070, 128.5918)' };
  const N = '(-?\\d+(?:\\.\\d+)?)';
  let m = new RegExp('@' + N + ',' + N).exec(s) || new RegExp('!3d' + N + '!4d' + N).exec(s) ||
    new RegExp('[?&](?:q|ll|query)=' + N + '(?:,|%2C)\\s*' + N, 'i').exec(s);
  if (!m) m = new RegExp('^' + N + '\\s*[,\\s]\\s*' + N + '$').exec(s);
  if (!m) return { error: '좌표 형식을 읽지 못했어요. 구글맵에서 지점을 우클릭해 나오는 숫자 두 개(예: 38.2070, 128.5918)를 붙여 넣어 주세요.' };
  return checkGeo(Number(m[1]), Number(m[2]));
}
const NUM_RE = /^-?\d+(\.\d+)?$/;

/* ===================== 지점 관리 (본사) ===================== */

    const paste = textInput('bf-coords', { placeholder: '예) 38.2070, 128.5918' });
    const lat = textInput('bf-lat', { inputmode: 'decimal', class: 'mono' });
    const lng = textInput('bf-lng', { inputmode: 'decimal', class: 'mono' });
    const radius = textInput('bf-radius', { inputmode: 'numeric', maxlength: '4', class: 'mono' });

    lat.value = b ? String(b.lat) : '';

    const mapLink = h('a', { target: '_blank', rel: 'noopener noreferrer', hidden: true, id: 'bf-maplink' }, '구글맵에서 위치 확인');
    const syncLink = function () {
      const ok = NUM_RE.test(lat.value.trim()) && NUM_RE.test(lng.value.trim());
      mapLink.hidden = !ok;
      if (ok) mapLink.href = 'https://www.google.com/maps?q=' + Number(lat.value) + ',' + Number(lng.value);
    };

    const applyPaste = function () {
      const r = parseCoords(paste.value);
      if (r.error) { showMsg(geoMsg, r.error, 'bad'); return false; }

        }

        const nm = cleanText(name.value);
        const np = textProblem(nm, '지점명', 1, 40);
        if (np) return bad(name, np);
        if (!lat.value.trim() && !lng.value.trim() && paste.value.trim()) { if (!applyPaste()) return bad(paste, geoMsg.textContent); }
        if (!NUM_RE.test(lat.value.trim())) return bad(lat, '위도를 숫자로 입력해 주세요. (구글맵 좌표를 붙여 넣고 \'적용\'을 눌러도 돼요)');

        } else {

        }

      h('div', { class: 'fld' }, h('label', { for: 'bf-coords' }, '구글맵 좌표 붙여넣기'),

        h('div', { class: 'hint', id: 'bf-coords-hint' }, '구글맵에서 지점을 우클릭하면 맨 위에 나오는 좌표를 누르면 복사돼요. 구글맵 주소(URL)를 붙여 넣어도 돼요.')),
      h('div', { class: 'formbtns', style: 'margin-top:10px' }, here, mapLink),

      h('div', { class: 'row2' }, fieldBox('bf-lat', '위도', lat), fieldBox('bf-lng', '경도', lng)),
      fieldBox('bf-radius', '출퇴근 허용 반경 (m)', radius, '지점 위치에서 이 거리 안이면 정상으로 봐요. 20~1000m. 벗어나도 출퇴근은 기록되고 확인 대상으로 표시돼요.'),
      editing ? fieldBox('bf-status', '상태', status, '재직 중인 직원이 있는 지점은 중지할 수 없어요.') : null,
      err,
      h('div', { class: 'formbtns' }, save, h('button', { type: 'button', class: 'btn', onclick: function () { formHost.replaceChildren(); } }, '취소')));
    formHost.replaceChildren(h('section', { class: 'card formcard' }, h('h2', null, editing ? '지점 수정 · ' + b.name : '지점 추가'), form));

  }

  load();

}
