        isHQ ? h('div', { class: 'fld' }, h('label', { for: 'sf-branch' }, '지점'), branchSel) : h('span', { class: 'sub' }, '소속: ' + (me.branch_name || me.branch_id)),
        addBtn)),
    h('label', { class: 'chk sub', for: 'sf-resigned' }, resCk, '퇴직한 직원도 보기'),
    listHost));

  const bname = function (id) {
    if (id === 'HQ') return 'AZMT 본사';
    const b = branches.filter(function (x) { return x.branch_id === id; })[0];
    return b ? String(b.name) : String(id || '-');
  };
  function note(kind, text) {
    noteHost.replaceChildren(h('p', { class: 'msg ' + kind, role: 'status', style: 'margin-top:0' }, text));
    announce(text);
  }

  async function load() {
    const my = ++loadSeq;
    listHost.replaceChildren(h('p', { class: 'sub' }, '불러오는 중…'));
    try {
      const reqs = [apiCall('listUsers', isHQ && filter ? { branch_id: filter } : {})];
      if (isHQ) reqs.push(apiCall('listBranches'));
      const res = await Promise.all(reqs);
      if (!ctx.isCurrent() || my !== loadSeq) return;
      if (!res[0] || !Array.isArray(res[0].users) || (isHQ && (!res[1] || !Array.isArray(res[1].branches)))) throw new ApiError('BAD_RESPONSE', '서버 응답 형식이 올바르지 않습니다.');
      users = res[0].users;
      branches = isHQ ? res[1].branches : [{ branch_id: me.branch_id, name: me.branch_name, status: 'ACTIVE' }];
      if (isHQ) {
        const keep = branchSel.value;
        branchSel.replaceChildren.apply(branchSel, [h('option', { value: '' }, '전체 지점')].concat(branches.map(function (b) { return h('option', { value: b.branch_id }, String(b.name) + (b.status === 'ACTIVE' ? '' : ' (중지)')); })));
        branchSel.value = filter || keep || '';
      }
      draw();
    } catch (x) {
      const e = wrapError(x);
      if (!ctx.isCurrent() || my !== loadSeq || handleCommonError(e)) return;
      listHost.replaceChildren(errBlock(e, load));
    }
  }

  function pills(u) {
    const out = [];
    if (u.status !== 'ACTIVE') out.push(h('span', { class: 'pill off' }, '퇴직'));
    if (u.role === 'GM') out.push(h('span', { class: 'pill info' }, '총지배인'));
    if (u.role === 'HQ') out.push(h('span', { class: 'pill info' }, '본사'));
    if (u.locked) out.push(h('span', { class: 'pill crit' }, '잠김'));
    if (u.pin_must_change && u.status === 'ACTIVE') out.push(h('span', { class: 'pill warn' }, '임시 PIN 대기'));
    if (u.status === 'ACTIVE' && u.role !== 'HQ' && !u.loc_consent_ok) out.push(h('span', { class: 'pill off' }, '위치 동의 전'));
    return out;
  }

  function draw() {
    const all = users.slice();
    const visible = all.filter(function (u) { return showResigned || u.status === 'ACTIVE'; });
    visible.sort(function (a, b) {
      if ((a.status === 'ACTIVE') !== (b.status === 'ACTIVE')) return a.status === 'ACTIVE' ? -1 : 1;
      if (a.branch_id !== b.branch_id) return String(a.branch_id).localeCompare(String(b.branch_id));
      if (a.role !== b.role) return a.role === 'GM' ? -1 : b.role === 'GM' ? 1 : 0;
      return String(a.name).localeCompare(String(b.name), 'ko');
    });
    if (!visible.length) {
      listHost.replaceChildren(h('p', { class: 'msg warn', style: 'margin-top:8px' }, all.length
        ? '재직 중인 직원이 없어요. \'퇴직한 직원도 보기\'를 켜면 퇴직한 직원이 보여요.'
        : '등록된 직원이 없어요. \'직원 추가\'로 등록해 주세요.'));
      return;
    }
    const active = all.filter(function (u) { return u.status === 'ACTIVE'; }).length;
    const rows = [];
    visible.forEach(function (u) {
      const opened = openId === u.user_id;
      const sub = [isHQ && !filter ? bname(u.branch_id) : '', u.hired_at && okDate(u.hired_at) ? '입사 ' + u.hired_at : ''].filter(Boolean).join(' · ');
      const toggle = h('button', { type: 'button', class: 'btn small', 'aria-expanded': opened ? 'true' : 'false', 'aria-label': u.name + ' 관리' }, opened ? '닫기' : '관리');
      toggle.addEventListener('click', function () { openId = opened ? null : u.user_id; draw(); });
      rows.push(h('tr', null,
        h('td', null, h('div', null, u.name), sub ? h('div', { class: 'sub' }, sub) : null),
        h('td', null, pills(u)),
        h('td', { class: 'acts-cell' }, toggle)));
      if (opened) rows.push(h('tr', null, h('td', { colspan: '3', style: 'background:var(--surface-2)' }, detail(u))));
    });
    listHost.replaceChildren(
      h('p', { class: 'sub', style: 'margin-top:8px' }, '재직 ' + active + '명' + (all.length - active ? ' · 퇴직 ' + (all.length - active) + '명' : '')),
      h('div', { class: 'scroll' }, h('table', { class: 't' },
        h('thead', null, h('tr', null, ['직원', '상태', ''].map(function (x) { return h('th', null, x); }))),
        h('tbody', null, rows))));
  }

  function showPin(name, pin, notice) {
    const msg = h('p', { class: 'sub', role: 'status' });
    const cp = h('button', { type: 'button', class: 'btn small' }, '복사');
    cp.addEventListener('click', async function () {
      const okc = await copyText(pin);
      msg.textContent = okc ? '복사했어요.' : '복사하지 못했어요. 화면의 숫자를 직접 전달해 주세요.';
    });
    pinHost.replaceChildren(h('section', { class: 'card formcard' }, h('h2', null, '임시 PIN · ' + name),
      h('div', { class: 'pinbox' },
        h('div', { class: 'sub' }, notice || '임시 PIN은 지금 한 번만 표시돼요.'),
        h('div', { class: 'big mono', id: 'temp-pin' }, pin),
        h('div', { class: 'sub' }, '이 화면을 벗어나면 다시 볼 수 없어요. 본인에게 직접 전달해 주세요. 첫 로그인 때 새 PIN으로 바꿔야 해요.')),
      h('div', { class: 'formbtns' }, cp, h('button', { type: 'button', class: 'btn primary', onclick: function () { pinHost.replaceChildren(); } }, '전달했어요 (닫기)')), msg));
    announce('임시 PIN을 발급했어요. 화면에서 확인해 주세요.');
  }

  /* 서버 호출 한 건 실행 → 성공 안내 + 목록 새로고침, 실패 시 서버 문구 표시 */
  async function run(action, params, okText, after) {
    try {
      const r = await apiCall(action, params);
      if (!ctx.isCurrent()) return;
      if (after) after(r);
      note('ok', okText);
      load();
    } catch (x) {
      const e = wrapError(x);
      if (handleCommonError(e)) return;
      note('bad', e.message + (e.uncertain ? ' 처리되었을 수 있으니 목록에서 상태를 확인해 주세요.' : ''));
      if (e.uncertain) load();
    }
  }

  function detail(u) {
    const canMg = isHQ || (me.role === 'GM' && u.role === 'STAFF' && u.branch_id === me.branch_id);
    const isSelf = u.user_id === me.user_id;
    const contactBox = h('div', { role: 'status' });
    const dl = h('dl', { class: 'dl', style: 'grid-template-columns:110px 1fr' },
      h('dt', null, '소속'), h('dd', null, bname(u.branch_id)),
      h('dt', null, '역할'), h('dd', null, ROLE_LABEL[u.role] || u.role),
      h('dt', null, '입사일'), h('dd', null, okDate(u.hired_at) ? u.hired_at : '미입력'),
      u.resigned_at && okDate(u.resigned_at) ? [h('dt', null, '퇴직일'), h('dd', null, u.resigned_at)] : null,
      h('dt', null, '최근 로그인'), h('dd', null, fmtStamp(u.last_login_at) || '아직 없음'),
      h('dt', null, '위치정보 동의'), h('dd', null, u.role === 'HQ' ? '해당 없음' : u.loc_consent_ok ? '동의함' : '동의 전'),
      h('dt', null, '구글 연결'), h('dd', null, u.google_linked ? '연결됨 (' + (u.google_email || '') + ')' : '없음'));

    let cbusy = false;
    const cbtn = h('button', { type: 'button', class: 'btn small' }, '연락처 보기');
    cbtn.addEventListener('click', async function () {
      if (cbusy) return;
      cbusy = true; cbtn.disabled = true;
      try {
        const r = await apiCall('getUserContact', { user_id: u.user_id });
        if (!ctx.isCurrent()) return;
        const digits = String((r && r.phone) || '').replace(/\D/g, '');
        if (!/^01\d{8,9}$/.test(digits)) throw new ApiError('BAD_RESPONSE', '연락처를 확인하지 못했어요. 등록된 번호를 점검해 주세요.');
        const cp = h('button', { type: 'button', class: 'btn small' }, '복사');
        const cm = h('span', { class: 'sub' });
        cp.addEventListener('click', async function () { cm.textContent = (await copyText(digits)) ? '복사했어요.' : '복사하지 못했어요.'; });
        contactBox.replaceChildren(h('div', { class: 'acts', style: 'margin-top:10px' },
          h('b', { class: 'mono' }, fmtPhone(digits)),
          h('a', { class: 'btn small', href: 'tel:' + digits, style: 'display:inline-flex;align-items:center;text-decoration:none' }, '전화 걸기'), cp, cm),
          h('p', { class: 'sub' }, '연락처를 열람하면 기록이 남아요.'));
      } catch (x) {
        const e = wrapError(x);
        if (!handleCommonError(e)) contactBox.replaceChildren(h('p', { class: 'msg bad', role: 'alert' }, e.message));
      }
      cbusy = false; cbtn.disabled = false;
    });

    const acts = [cbtn];
    if (canMg) {
      acts.push(h('button', { type: 'button', class: 'btn small', onclick: function () { openEdit(u); } }, '수정'));
      if (u.locked) acts.push(h('button', { type: 'button', class: 'btn small', onclick: function () { run('unlockUser', { user_id: u.user_id }, u.name + '님의 잠금을 해제했어요.'); } }, '잠금 해제'));
      if (!isSelf && u.status === 'ACTIVE') {
        acts.push(confirmAction('PIN 초기화', '새 임시 PIN을 발급하고 로그인 상태를 종료해요.', function () {
          return run('resetPin', { user_id: u.user_id }, u.name + '님의 PIN을 초기화했어요.', function (r) { if (r && r.temp_pin) showPin(u.name, String(r.temp_pin), r.notice); });
        }));
        acts.push(confirmAction('퇴직 처리', '로그인이 막히고 이후 월간 계획 대상에서 빠져요.', function () {
          return run('updateUser', { user_id: u.user_id, status: 'INACTIVE' }, u.name + '님을 퇴직 처리했어요.');
        }));
      }
      if (!isSelf && u.status !== 'ACTIVE') {
        acts.push(confirmAction('복직', '재직 상태로 되돌리고 새 임시 PIN을 발급해요.', function () {
          return run('updateUser', { user_id: u.user_id, status: 'ACTIVE' }, u.name + '님을 복직 처리했어요.', function (r) { if (r && r.temp_pin) showPin(u.name, String(r.temp_pin), r.notice); });
        }));
      }
      if (!isSelf && u.google_linked) {
        acts.push(confirmAction('구글 연결 해제', '이 직원의 구글 로그인이 즉시 막혀요. 휴대폰+PIN 로그인은 그대로예요.', function () {
          return run('unlinkGoogle', { user_id: u.user_id }, u.name + '님의 구글 연결을 해제했어요.');
        }));
      }
    }
    return h('div', { style: 'padding:6px 4px 10px' }, dl, h('div', { class: 'acts', style: 'margin-top:12px' }, acts),
      canMg ? null : h('p', { class: 'sub', style: 'margin-top:8px' }, '이 계정은 본사에서 관리해요.'), contactBox);
  }

  /* ---- 등록 · 수정 폼 ---- */
  function activeBranches(includeId) {
    return branches.filter(function (b) { return b.status === 'ACTIVE' || b.branch_id === includeId; });
  }
  function branchOptions(includeId) {
    return activeBranches(includeId).map(function (b) { return [b.branch_id, String(b.name) + (b.status === 'ACTIVE' ? '' : ' (중지)')]; });
  }

  function openCreate() {
    const err = h('p', { role: 'alert', hidden: true });
    const name = textInput('sf-name', { maxlength: '30', required: true, 'data-autofocus': '1' });
    const phone = textInput('sf-phone', { type: 'tel', inputmode: 'numeric', maxlength: '13', class: 'mono', placeholder: '01012345678' });
    const hired = h('input', { id: 'sf-hired', type: 'date' });
    const roleSel = isHQ ? selectInput('sf-role', [['STAFF', '현장 인력'], ['GM', '총지배인'], ['HQ', '본사 담당자']], 'STAFF') : null;
    const opts = branchOptions();
    const brSel = isHQ ? selectInput('sf-newbranch', opts.length ? opts : [['', '운영 중인 지점 없음']], filter && opts.some(function (o) { return o[0] === filter; }) ? filter : (opts[0] ? opts[0][0] : '')) : null;
    const brBox = isHQ ? fieldBox('sf-newbranch', '소속 지점', brSel) : null;
    if (isHQ) roleSel.addEventListener('change', function () { brBox.hidden = roleSel.value === 'HQ'; });
    let busy = false;
    const save = h('button', { type: 'submit', class: 'btn primary' }, '등록');
    const form = h('form', {
      novalidate: true,
      onsubmit: async function (ev) {
        ev.preventDefault();
        if (busy) return;
        err.hidden = true;
        [name, phone, hired].forEach(function (el) { setInvalid(el, false); });
        const bad = function (el, m) { setInvalid(el, true); showMsg(err, m); el.focus(); };
        const nm = cleanText(name.value);
        const np = textProblem(nm, '이름', 1, 30);
        if (np) return bad(name, np);
        const ph = normalizePhone(phone.value);
        if (!ph) return bad(phone, '휴대폰 번호를 확인해 주세요. (예: 01012345678) 로그인 ID로 쓰이고 중복 등록은 안 돼요.');
        const hd = hired.value.trim();
        if (hd && !realDate(hd)) return bad(hired, '입사일 형식이 올바르지 않아요.');
        const role = isHQ ? roleSel.value : 'STAFF';
        const params = { name: nm, phone: ph, role: role };
        if (role !== 'HQ') {
          params.branch_id = isHQ ? brSel.value : me.branch_id;
          if (!params.branch_id) return bad(isHQ ? brSel : name, '소속 지점을 선택해 주세요. 운영 중인 지점이 없으면 먼저 지점을 등록해 주세요.');
        }
        if (hd) params.hired_at = hd;
        busy = true; save.disabled = true; save.textContent = '등록 중…';
        try {
          const r = await apiCall('createUser', params);
          if (!ctx.isCurrent()) return;
          formHost.replaceChildren();
          if (r && r.temp_pin) showPin(nm, String(r.temp_pin), r.notice);
          note('ok', nm + '님을 등록했어요. 아래 임시 PIN을 본인에게 전달해 주세요.');
          load();
        } catch (x) {
          const e = wrapError(x);
          if (handleCommonError(e)) return;
          showMsg(err, e.message + (e.uncertain ? ' 등록되었을 수 있어요. 목록에 있으면 \'PIN 초기화\'로 임시 PIN을 다시 발급하세요.' : ''));
          if (e.uncertain) load();
        } finally {
          busy = false; save.disabled = false; save.textContent = '등록';
        }
      }
    },
      fieldBox('sf-name', '이름', name),
      fieldBox('sf-phone', '휴대폰 번호 (필수)', phone, '로그인 ID이자 비상 연락처예요. 등록하면 임시 PIN이 한 번만 표시돼요.'),
      fieldBox('sf-hired', '입사일 (선택)', hired, '월간 계획 대상 기간 계산에 쓰여요. 비워 두면 기간 제한이 없어요.'),
      isHQ ? fieldBox('sf-role', '역할', roleSel) : null, brBox, err,
      h('div', { class: 'formbtns' }, save, h('button', { type: 'button', class: 'btn', onclick: function () { formHost.replaceChildren(); } }, '취소')));
    formHost.replaceChildren(h('section', { class: 'card formcard' }, h('h2', null, '직원 추가' + (!isHQ ? ' · ' + (me.branch_name || '') : '')), form));
    try { name.focus(); } catch (e) { /* 무시 */ }
  }

  function openEdit(u) {
    const isSelf = u.user_id === me.user_id;
    const err = h('p', { role: 'alert', hidden: true });
    const name = textInput('sf-name', { maxlength: '30', required: true });
    name.value = String(u.name);
    const phone = textInput('sf-phone', { type: 'tel', inputmode: 'numeric', maxlength: '13', class: 'mono', placeholder: '바꿀 때만 입력' });
    const hired = h('input', { id: 'sf-hired', type: 'date' });
    hired.value = okDate(u.hired_at) ? u.hired_at : '';
    const canRoleBranch = isHQ && u.role !== 'HQ' && !isSelf;
    const roleSel = canRoleBranch ? selectInput('sf-role', [['STAFF', '현장 인력'], ['GM', '총지배인']], u.role) : null;
    const brSel = canRoleBranch ? selectInput('sf-newbranch', branchOptions(u.branch_id), u.branch_id) : null;
    let busy = false;
    const save = h('button', { type: 'submit', class: 'btn primary' }, '저장');
    const form = h('form', {
      novalidate: true,
      onsubmit: async function (ev) {
        ev.preventDefault();
        if (busy) return;
        err.hidden = true;
        [name, phone, hired].forEach(function (el) { setInvalid(el, false); });
        const bad = function (el, m) { setInvalid(el, true); showMsg(err, m); el.focus(); };
        const nm = cleanText(name.value);
        const np = textProblem(nm, '이름', 1, 30);
        if (np) return bad(name, np);
        const params = { user_id: u.user_id };
        if (nm !== String(u.name)) params.name = nm;
        if (phone.value.trim()) {
          const ph = normalizePhone(phone.value);
          if (!ph) return bad(phone, '휴대폰 번호를 확인해 주세요. (예: 01012345678)');
          params.phone = ph;
        }
        const hd = hired.value.trim();
        if (hd && !realDate(hd)) return bad(hired, '입사일 형식이 올바르지 않아요.');
        if (hd !== (okDate(u.hired_at) ? u.hired_at : '')) params.hired_at = hd;
        let moved = false;
        if (canRoleBranch) {
          if (roleSel.value !== u.role) { params.role = roleSel.value; moved = true; }
          if (brSel.value && brSel.value !== u.branch_id) { params.branch_id = brSel.value; moved = true; }
        }
        if (Object.keys(params).length === 1) return showMsg(err, '변경한 내용이 없어요.', 'info');
        busy = true; save.disabled = true; save.textContent = '저장 중…';
        try {
          await apiCall('updateUser', params);
          if (!ctx.isCurrent()) return;
          formHost.replaceChildren();
          note('ok', nm + '님 정보를 저장했어요.' + (moved ? ' 역할·지점이 바뀌어 해당 직원은 다시 로그인해야 해요.' : ''));
          load();
        } catch (x) {
          const e = wrapError(x);
          if (handleCommonError(e)) return;
          showMsg(err, e.message + (e.uncertain ? ' 저장되었을 수 있으니 목록을 확인해 주세요.' : ''));
          if (e.uncertain) load();
        } finally {
          busy = false; save.disabled = false; save.textContent = '저장';
        }
      }
    },
      fieldBox('sf-name', '이름', name),
      fieldBox('sf-phone', '휴대폰 번호', phone, '비워 두면 그대로 유지돼요. 현재 번호는 \'연락처 보기\'로 확인할 수 있어요. 번호를 바꾸면 로그인 ID도 바뀌어요.'),
      fieldBox('sf-hired', '입사일', hired, '월간 계획 대상 기간 계산에 쓰여요.'),
      canRoleBranch ? [fieldBox('sf-role', '역할', roleSel), fieldBox('sf-newbranch', '소속 지점', brSel, '역할이나 지점을 바꾸면 이 직원의 로그인 상태가 종료돼요.')] : null,
      err,
      h('div', { class: 'formbtns' }, save, h('button', { type: 'button', class: 'btn', onclick: function () { formHost.replaceChildren(); } }, '취소')));
    formHost.replaceChildren(h('section', { class: 'card formcard' }, h('h2', null, '직원 수정 · ' + u.name), form));
    try { name.focus(); } catch (e) { /* 무시 */ }
  }

  load();
}

/* ===================== 근무코드 (본사: 공통 코드 · 지점별 조정 / 총지배인: 소속 지점 조정) ===================== */
const TYPE_LABEL = { WORK: '근무', LEAVE: '휴가', OFF: '휴무' };
const LEAVE_KIND_LABEL = { ANNUAL: '연차', HALF: '반차', SICK: '병가', OFFICIAL: '공가' };
const TIME_RE = /^([01]\d|2[0-3]):[0-5]\d$/;
function leaveText(c) {
  if (c.leave_kind === 'HALF') return c.leave_unit === 'AM' ? '오전 반차' : c.leave_unit === 'PM' ? '오후 반차' : '반차';
  return LEAVE_KIND_LABEL[c.leave_kind] || '휴가';
}
function hmToMin(s) { const a = String(s).split(':'); return parseInt(a[0], 10) * 60 + parseInt(a[1], 10); }
function hoursText(min) { return min % 60 === 0 ? (min / 60) + '시간' : fmtDur(min); }
function breakRulesText(rules) {
  if (!Array.isArray(rules) || !rules.length) return '';
  return rules.map(function (r) { return hoursText(r.gross_min_from) + ' 이상 ' + r.break_min + '분'; }).join(', ');
}
/* 입력 중인 출·퇴근 시각의 예상 근무시간. 최종 판단은 서버가 하며, 이 값은 안내용이다. */
function shiftPreview(start, end, rules) {
  if (!TIME_RE.test(start) || !TIME_RE.test(end)) return { text: '출근·퇴근 시각을 모두 입력해 주세요.', bad: false };
  const s = hmToMin(start), e = hmToMin(end);
  if (s === e) return { text: '출근과 퇴근 시각이 같을 수 없어요.', bad: true };
  const crosses = e < s;
  const gross = (crosses ? e + 1440 : e) - s;
  if (gross < 60) return { text: '근무시간은 최소 1시간 이상이어야 해요.', bad: true };
  const over = gross > 960 ? ' ※ 1회 근무는 보통 최대 16시간까지예요. 저장 시 서버가 한도를 확인해요.' : '';
  let brk = 0;
  (rules || []).slice().sort(function (a, b) { return a.gross_min_from - b.gross_min_from; }).forEach(function (r) { if (gross >= r.gross_min_from) brk = r.break_min; });
  return { text: (crosses ? '다음 날 퇴근 · ' : '') + '출근~퇴근 ' + fmtDur(gross) + ' − 휴게 ' + brk + '분 = 실근무 ' + fmtDur(gross - brk) + ' (예상)' + over, bad: false };
}

function renderCodes(host, ctx) {
  const me = ctx.user;
  const isHQ = me.role === 'HQ';
  const wrap = h('div', { class: 'stack' });
  host.append(wrap);
  const noteHost = h('div');
  const formHost = h('div');
  const infoHost = h('div');
  const listHost = h('div', null, h('p', { class: 'sub' }, '불러오는 중…'));
  let scope = isHQ ? '' : me.branch_id; // '' = 공통(본사 전용)
  let branches = [];
  let data = null;
  let loadSeq = 0;
  const isCommon = function () { return isHQ && scope === ''; };

  const scopeSel = selectInput('cf-scope', [['', '공통 코드 (전 지점)']], '');
  scopeSel.addEventListener('change', function () { scope = scopeSel.value; formHost.replaceChildren(); noteHost.replaceChildren(); load(); });
  const addBtn = h('button', { type: 'button', class: 'btn primary small', onclick: function () { openCreate(); } }, '코드 추가');
  wrap.append(noteHost, formHost, h('section', { class: 'card' },
    h('div', { class: 'toolbar' }, h('h2', null, '근무코드'),
      h('div', { class: 'acts', style: 'align-items:end' },
        isHQ ? h('div', { class: 'fld' }, h('label', { for: 'cf-scope' }, '보기'), scopeSel) : h('span', { class: 'sub' }, '지점: ' + (me.branch_name || me.branch_id)),
        isHQ ? addBtn : null)),
    infoHost, listHost));

  function note(kind, text) {
    noteHost.replaceChildren(h('p', { class: 'msg ' + kind, role: 'status', style: 'margin-top:0' }, text));
    announce(text);
  }

  async function load() {
    const my = ++loadSeq;
    listHost.replaceChildren(h('p', { class: 'sub' }, '불러오는 중…'));
    addBtn.hidden = !isCommon();
    try {
      const reqs = [apiCall('listWorkCodes', isHQ && scope ? { branch_id: scope } : {})];
      if (isHQ) reqs.push(apiCall('listBranches'));
      const res = await Promise.all(reqs);
      if (!ctx.isCurrent() || my !== loadSeq) return;
      if (!res[0] || !Array.isArray(res[0].codes) || (isHQ && (!res[1] || !Array.isArray(res[1].branches)))) throw new ApiError('BAD_RESPONSE', '서버 응답 형식이 올바르지 않습니다.');
      data = res[0];
      if (isHQ) {
        branches = res[1].branches;
        scopeSel.replaceChildren.apply(scopeSel, [h('option', { value: '' }, '공통 코드 (전 지점)')].concat(branches.map(function (b) { return h('option', { value: b.branch_id }, String(b.name) + ' 지점 조정'); })));
        scopeSel.value = scope;
      }
      draw();
    } catch (x) {
      const e = wrapError(x);
      if (!ctx.isCurrent() || my !== loadSeq || handleCommonError(e)) return;
      listHost.replaceChildren(errBlock(e, load));
    }
  }

  function draw() {
    const rules = data.break_rules || [];
    const rt = breakRulesText(rules);
    infoHost.replaceChildren(
      isCommon()
        ? h('p', { class: 'sub', style: 'margin-top:8px' }, '공통 코드는 모든 지점에 적용돼요. 지점마다 시간이 다르면 위에서 지점을 골라 조정해 주세요.')
        : h('p', { class: 'sub', style: 'margin-top:8px' }, '공통 코드의 시간을 이 지점에 맞게 조정해요. 조정한 시간은 이 지점의 계획에만 적용되고, 이미 승인된 달은 승인 당시 시간이 그대로 유지돼요.'),
      rt ? h('p', { class: 'sub' }, '휴게시간은 자동 계산돼요: 출근~퇴근 ' + rt + '.') : null);
    if (!data.codes.length) {
      listHost.replaceChildren(h('p', { class: 'msg warn', style: 'margin-top:8px' }, isCommon() ? '등록된 근무코드가 없어요. \'코드 추가\'로 등록해 주세요.' : '사용할 수 있는 근무코드가 없어요. 본사에 문의해 주세요.'));
      return;
    }
    const rows = data.codes.map(function (c) { return h('tr', null,
      h('td', null, h('b', { class: 'mono' }, c.code), h('div', { class: 'sub' }, c.name)),
      h('td', null, contentOf(c)),
      h('td', null, statusOf(c)),
      h('td', { class: 'acts-cell' }, actionsOf(c, rules))); });
    listHost.replaceChildren(h('div', { class: 'scroll' }, h('table', { class: 't' },
      h('thead', null, h('tr', null, ['코드', '내용', '상태', ''].map(function (x) { return h('th', null, x); }))),
      h('tbody', null, rows))));
  }

  function contentOf(c) {
    if (c.type === 'WORK') {
      if (c.error) return h('span', { class: 'sub' }, c.error);
      const t = c.start + '–' + c.end + (c.crosses_midnight ? ' (익일)' : '');
      return h('div', null, h('div', { class: 'mono' }, t),
        h('div', { class: 'sub' }, '실근무 ' + fmtDur(c.net_min) + ' · 휴게 ' + c.break_min + '분'),
        c.overridden ? h('div', null, h('span', { class: 'pill info' }, '지점 조정'), h('span', { class: 'sub' }, ' 공통 ' + c.common_start + '–' + c.common_end)) : null);
    }
    if (c.type === 'LEAVE') return h('span', null, leaveText(c));
    return h('span', null, '휴무');
  }
  function statusOf(c) {
    const out = [h('span', { class: 'pill off' }, TYPE_LABEL[c.type] || c.type)];
    if (c.error) out.push(h('span', { class: 'pill crit' }, '설정 오류'));
    else if (c.branch_disabled) out.push(h('span', { class: 'pill off' }, '이 지점 사용 안 함'));
    else if (!c.active) out.push(h('span', { class: 'pill off' }, '중지'));
    else out.push(h('span', { class: 'pill' }, '사용'));
    return out;
  }

  async function runCall(action, params, okText, after) {
    try {
      const r = await apiCall(action, params);
      if (!ctx.isCurrent()) return;
      note('ok', okText + (after ? after(r) : ''));
      load();
    } catch (x) {
      const e = wrapError(x);
      if (handleCommonError(e)) return;
      note('bad', e.message + (e.uncertain ? ' 처리되었을 수 있으니 목록에서 상태를 확인해 주세요.' : ''));
      if (e.uncertain) load();
    }
  }
  const ownTimeNote = function (r) { return r && r.branches_with_own_time > 0 ? ' 자체 시간을 쓰는 ' + r.branches_with_own_time + '개 지점은 영향을 받지 않아요.' : ''; };

  function actionsOf(c, rules) {
    const acts = [];
    if (isCommon()) {
      acts.push(h('button', { type: 'button', class: 'btn small', 'aria-label': c.code + ' 수정', onclick: function () { openEdit(c, rules); } }, '수정'));
      if (c.active && c.code !== 'OFF') {
        acts.push(confirmAction('사용 중지', '새 계획에서 이 코드를 쓸 수 없게 돼요. 이미 승인된 계획은 그대로예요.', function () {
          return runCall('updateWorkCode', { code: c.code, active: false }, c.code + ' 코드를 중지했어요.');
        }));
      } else if (!c.active && !c.error) {
        acts.push(h('button', { type: 'button', class: 'btn small', onclick: function () { runCall('updateWorkCode', { code: c.code, active: true }, c.code + ' 코드를 다시 사용해요.'); } }, '다시 사용'));
      }
      return h('div', { class: 'acts' }, acts);
    }
    if (c.type !== 'WORK') return h('span', { class: 'sub' }, '-');
    if (!c.active && !c.branch_disabled) return h('span', { class: 'sub' }, '공통 코드가 중지 상태예요.');
    if (c.error && !c.branch_disabled) return h('span', { class: 'sub' }, '본사에서 시간을 바로잡아야 해요.');
    acts.push(h('button', { type: 'button', class: 'btn small', 'aria-label': c.code + ' 시간 조정', onclick: function () { openOverride(c, rules); } }, '시간 조정'));
    if (c.overridden) {
      acts.push(confirmAction('공통값으로', '이 지점의 조정 시간을 지우고 공통 시간(' + c.common_start + '–' + c.common_end + ')을 써요.', function () {
        return runCall('clearBranchWorkCode', { branch_id: scope, code: c.code }, c.code + ' 코드를 공통 시간으로 되돌렸어요.');
      }));
    }
    if (c.branch_disabled) {
      acts.push(h('button', { type: 'button', class: 'btn small', onclick: function () { runCall('setBranchWorkCode', { branch_id: scope, code: c.code, active: true }, c.code + ' 코드를 이 지점에서 다시 사용해요.'); } }, '이 지점 사용'));
    } else {
      acts.push(confirmAction('이 지점 사용 안 함', '이 지점의 새 계획에서 ' + c.code + ' 코드를 쓸 수 없게 돼요.', function () {
        return runCall('setBranchWorkCode', { branch_id: scope, code: c.code, active: false }, c.code + ' 코드를 이 지점에서 사용하지 않아요.');
      }));
    }
    return h('div', { class: 'acts' }, acts);
  }

  /* ---- 시간 입력 묶음(출근·퇴근 + 예상 시간) ---- */
  function timeFields(rules, start0, end0) {
    const start = h('input', { id: 'cf-start', type: 'time' });
    const end = h('input', { id: 'cf-end', type: 'time' });
    start.value = start0 || ''; end.value = end0 || '';
    const prev = h('p', { class: 'sub', id: 'cf-preview', role: 'status' });
    const upd = function () { const p = shiftPreview(start.value, end.value, rules); prev.textContent = p.text; prev.style.color = p.bad ? 'var(--crit)' : ''; };
    start.addEventListener('input', upd); end.addEventListener('input', upd);
    upd();
    const node = h('div', null, h('div', { class: 'row2' }, fieldBox('cf-start', '출근', start), fieldBox('cf-end', '퇴근', end)), prev,
      h('p', { class: 'hint' }, '퇴근이 출근보다 이르면 다음 날 퇴근(야간 근무)으로 봐요.'));
    return { start: start, end: end, node: node };
  }
  function leaveFields(kind0, unit0) {
    const kind = selectInput('cf-kind', [['ANNUAL', '연차'], ['HALF', '반차'], ['SICK', '병가'], ['OFFICIAL', '공가']], kind0 || 'ANNUAL');
    const unit = selectInput('cf-unit', [['FULL', '종일'], ['AM', '오전'], ['PM', '오후']], unit0 || 'FULL');
    return { kind: kind, unit: unit, node: h('div', { class: 'row2' }, fieldBox('cf-kind', '휴가 종류', kind), fieldBox('cf-unit', '단위', unit, '반차는 오전·오후, 그 외는 종일')) };
  }
  const leaveProblem = function (kind, unit) {
    if (kind === 'HALF' && unit === 'FULL') return '반차는 오전 또는 오후 단위로 정해 주세요.';
    if (kind !== 'HALF' && unit !== 'FULL') return '반차가 아닌 휴가는 종일 단위예요.';
    return '';
  };

  function formShell(title, form) {
    formHost.replaceChildren(h('section', { class: 'card formcard' }, h('h2', null, title), form));
  }
  function bindSubmit(opts) {
    let busy = false;
    const save = h('button', { type: 'submit', class: 'btn primary' }, opts.label);
    const err = h('p', { role: 'alert', hidden: true });
    const form = h('form', {
      novalidate: true,
      onsubmit: async function (ev) {
        ev.preventDefault();
        if (busy) return;
        err.hidden = true;
        const r = opts.collect(function (el, m) { if (el) { setInvalid(el, true); el.focus(); } showMsg(err, m); });
        if (!r) return;
        busy = true; save.disabled = true; save.textContent = '저장 중…';
        try {
          const res = await apiCall(r.action, r.params);
          if (!ctx.isCurrent()) return;
          formHost.replaceChildren();
          note('ok', r.okText + (r.after ? r.after(res) : ''));
          load();
        } catch (x) {
          const e = wrapError(x);
          if (handleCommonError(e)) return;
          showMsg(err, e.message + (e.uncertain ? ' 처리되었을 수 있으니 목록을 확인해 주세요.' : ''));
          if (e.uncertain) load();
        } finally {
          busy = false; save.disabled = false; save.textContent = opts.label;
        }
      }
    }, opts.body, err, h('div', { class: 'formbtns' }, save, h('button', { type: 'button', class: 'btn', onclick: function () { formHost.replaceChildren(); } }, '취소')));
    return form;
  }

  function openCreate() {
    const rules = data ? data.break_rules : [];
    const code = textInput('cf-code', { maxlength: '3', class: 'mono', placeholder: '예) A', required: true });
    const name = textInput('cf-name', { maxlength: '20', required: true });
    const type = selectInput('cf-type', [['WORK', '근무'], ['LEAVE', '휴가'], ['OFF', '휴무']], 'WORK');
    code.addEventListener('input', function () { code.value = code.value.toUpperCase(); });
    const tf = timeFields(rules, '09:00', '18:00');
    const lf = leaveFields();
    const workBox = h('div', null, tf.node), leaveBox = h('div', { hidden: true }, lf.node);
    type.addEventListener('change', function () { workBox.hidden = type.value !== 'WORK'; leaveBox.hidden = type.value !== 'LEAVE'; });
    const form = bindSubmit({
      label: '코드 등록',
      body: [fieldBox('cf-code', '코드', code, '영문 대문자로 시작하는 1~3자(영문·숫자). 등록 후 코드 글자는 바꿀 수 없어요.'), fieldBox('cf-name', '이름', name), fieldBox('cf-type', '종류', type), workBox, leaveBox],
      collect: function (bad) {
        [code, name, tf.start, tf.end].forEach(function (el) { setInvalid(el, false); });
        const cd = code.value.trim().toUpperCase();
        if (!/^[A-Z][A-Z0-9]{0,2}$/.test(cd)) return bad(code, '코드는 영문 대문자로 시작하는 1~3자(영문·숫자)로 입력해 주세요.'), null;
        const nm = cleanText(name.value);
        const np = textProblem(nm, '코드 이름', 1, 20);
        if (np) return bad(name, np), null;
        const params = { code: cd, name: nm, type: type.value };
        if (type.value === 'WORK') {
          if (!TIME_RE.test(tf.start.value) || !TIME_RE.test(tf.end.value)) return bad(tf.start, '출근·퇴근 시각을 입력해 주세요.'), null;
          const p = shiftPreview(tf.start.value, tf.end.value, rules);
          if (p.bad) return bad(tf.end, p.text), null;
          params.start = tf.start.value; params.end = tf.end.value;
        } else if (type.value === 'LEAVE') {
          const lp = leaveProblem(lf.kind.value, lf.unit.value);
          if (lp) return bad(lf.unit, lp), null;
          params.leave_kind = lf.kind.value; params.leave_unit = lf.unit.value;
        }
        return { action: 'createWorkCode', params: params, okText: cd + ' 코드를 등록했어요.' };
      }
    });
    formShell('코드 추가', form);
    try { code.focus(); } catch (e) { /* 무시 */ }
  }

  function openEdit(c, rules) {
    const name = textInput('cf-name', { maxlength: '20', required: true });
    name.value = String(c.name);
    const tf = c.type === 'WORK' ? timeFields(rules, c.common_start || c.start, c.common_end || c.end) : null;
    const lf = c.type === 'LEAVE' ? leaveFields(c.leave_kind, c.leave_unit) : null;
    const form = bindSubmit({
      label: '저장',
      body: [h('p', { class: 'sub', style: 'margin-top:8px' }, '코드 ' + c.code + ' · ' + (TYPE_LABEL[c.type] || c.type)), fieldBox('cf-name', '이름', name), tf ? tf.node : null, lf ? lf.node : null],
      collect: function (bad) {
        setInvalid(name, false);
        const nm = cleanText(name.value);
        const np = textProblem(nm, '코드 이름', 1, 20);
        if (np) return bad(name, np), null;
        const params = { code: c.code };
        if (nm !== String(c.name)) params.name = nm;
        let timeChanged = false;
        if (tf) {
          if (!TIME_RE.test(tf.start.value) || !TIME_RE.test(tf.end.value)) return bad(tf.start, '출근·퇴근 시각을 입력해 주세요.'), null;
          const p = shiftPreview(tf.start.value, tf.end.value, rules);
          if (p.bad) return bad(tf.end, p.text), null;
          if (tf.start.value !== c.common_start || tf.end.value !== c.common_end) { params.start = tf.start.value; params.end = tf.end.value; timeChanged = true; }
        }
        if (lf) {
          const lp = leaveProblem(lf.kind.value, lf.unit.value);
          if (lp) return bad(lf.unit, lp), null;
          if (lf.kind.value !== c.leave_kind || lf.unit.value !== c.leave_unit) { params.leave_kind = lf.kind.value; params.leave_unit = lf.unit.value; }
        }
        if (Object.keys(params).length === 1) return bad(null, '변경한 내용이 없어요.'), null;
        return { action: 'updateWorkCode', params: params, okText: c.code + ' 코드를 저장했어요.' + (timeChanged ? ' 이미 승인된 계획은 승인 당시 시간이 유지돼요.' : ''), after: ownTimeNote };
      }
    });
    formShell('코드 수정 · ' + c.code, form);
    try { name.focus(); } catch (e) { /* 무시 */ }
  }

  function openOverride(c, rules) {
    const tf = timeFields(rules, c.start, c.end);
    const form = bindSubmit({
      label: '시간 저장',
      body: [h('p', { class: 'sub', style: 'margin-top:8px' }, '공통 시간: ' + c.common_start + '–' + c.common_end), tf.node],
      collect: function (bad) {
        if (!TIME_RE.test(tf.start.value) || !TIME_RE.test(tf.end.value)) return bad(tf.start, '출근·퇴근 시각을 입력해 주세요.'), null;
        const p = shiftPreview(tf.start.value, tf.end.value, rules);
        if (p.bad) return bad(tf.end, p.text), null;
        if (tf.start.value === c.start && tf.end.value === c.end && c.overridden) return bad(null, '변경한 내용이 없어요.'), null;
        return { action: 'setBranchWorkCode', params: { branch_id: scope, code: c.code, start: tf.start.value, end: tf.end.value }, okText: c.code + ' 코드의 이 지점 시간을 저장했어요. 이미 승인된 계획은 승인 당시 시간이 유지돼요.' };
      }
    });
    formShell('시간 조정 · ' + c.code + ' ' + c.name, form);
    try { tf.start.focus(); } catch (e) { /* 무시 */ }
  }

  load();
}

/* ===================== 7-4: 월간 근무계획 (순수 계산 도우미) ===================== */
/* 화면 코드와 분리해 둔 계산들. 서버가 최종 판단하며, 여기서는 사용자가 헛걸음하지 않도록 미리 알려 주는 용도다. */
const PLAN_STATUS_LABEL = { DRAFT: '작성 중', SUBMITTED: '본사 검토 중', APPROVED: '승인됨', REJECTED: '반려됨' };
const PLAN_BATCH_MAX = 1500;   // 서버 setPlanDays 한도
const PLAN_CHANGE_MAX = 200;   // 서버 requestPlanChange 한도
const planKey = function (uid, date) { return uid + '|' + date; };

/* 입력·제출은 당월부터 2개월 후까지만 (서버 assertPlanMonth_ 와 같은 규칙) */
function planMonthEditable(ym, today) {
  const cur = String(today).slice(0, 7);
  return ym >= cur && ym <= addMonthStr(cur, 2);
}
function inWindow(u, date) {
  return !!u && okDate(date) && okDate(u.window_start) && okDate(u.window_end) && date >= u.window_start && date <= u.window_end;
}
/* 재직 기간 안인데 코드가 비어 있는 칸 수 */
function planMissingCount(users, dates, local) {
  let n = 0;
  users.forEach(function (u) {
    dates.forEach(function (d) { if (inWindow(u, d) && !local[planKey(u.user_id, d)]) n++; });
  });
  return n;
}
/* 서버 상태(server)와 화면 상태(local)가 다른 칸의 키 목록 */
function planDiffKeys(server, local) {
  const seen = {};
  const out = [];
  Object.keys(server).concat(Object.keys(local)).forEach(function (k) {
    if (seen[k]) return;
    seen[k] = true;
    if ((server[k] || '') !== (local[k] || '')) out.push(k);
  });
  out.sort();
  return out;
}
function splitPlanKey(k) {
  const i = k.indexOf('|');
  return { user_id: k.slice(0, i), date: k.slice(i + 1) };
}
function chunkList(list, size) {
  const out = [];
  for (let i = 0; i < list.length; i += size) out.push(list.slice(i, i + size));
  return out;
}
function minutesText(min) {
  if (!min) return '0시간';
  return min % 60 === 0 ? (min / 60) + '시간' : Math.floor(min / 60) + '시간 ' + (min % 60) + '분';
}
function codeCellClass(meta) {
  if (!meta) return 't-X';
  if (meta.type === 'WORK') return 't-WORK';
  if (meta.type === 'LEAVE') return 't-LEAVE';
  return 't-OFF';
}
function codeDetailText(c) {
  if (!c) return '';
  if (c.type === 'WORK') return c.error ? '시간 설정 오류' : c.start + '–' + c.end + (c.crosses_midnight ? ' (익일)' : '');
  if (c.type === 'LEAVE') return leaveText(c);
  return '휴무';
}

/* ===================== 7-4: 월간 근무계획 화면 ===================== */
function renderPlan(host, ctx) {
  const me = ctx.user;
  const isHQ = me.role === 'HQ';
  const today = kstTodayStr();
  const curYm = today.slice(0, 7);
  const minYm = addMonthStr(curYm, -12);
  const maxYm = addMonthStr(curYm, 2);

  let ym = addMonthStr(curYm, 1);          // 보통 다음 달 계획을 쓰므로 기본값
  let branchId = isHQ ? '' : me.branch_id;
  let branches = [];
  let data = null;                          // getPlan 결과
  let codeList = [];                        // 이 지점에 적용되는 근무코드
  let codeMeta = {};
  let server = {};                          // 서버에 저장된 칸: key → code
  let snaps = {};                           // 승인 시 확정된 근무시간: key → snapshot
  let local = {};                           // 화면에서 편집 중인 칸
  let brush;                                // undefined=미선택, ''=지우기/원래대로
  let mode = 'view';                        // view | edit | change
  let loadSeq = 0, queueSeq = 0;
  let busy = false;
  let cellRefs = {};
  let totalRefs = {};
  let summaryEl = null, saveBtn = null, undoBtn = null, submitWrap = null, sendBtn = null, changeReason = null;

  const wrap = h('div', { class: 'stack' });
  host.append(wrap);
  const noteHost = h('div');
  const queueHost = h('div');
  const headHost = h('section', { class: 'card' });
  const actionHost = h('div');
  const gridHost = h('div');
  wrap.append(noteHost, queueHost, headHost, actionHost, gridHost);

  function note(kind, text) {
    noteHost.replaceChildren(h('p', { class: 'msg ' + kind, role: 'status', style: 'margin-top:0' }, text));
    announce(text);
  }
  const planOf = function () { return data && data.plan ? data.plan : null; };
  const usersOf = function () { return data && Array.isArray(data.users) ? data.users : []; };
  const nameOf = function (uid) { const u = usersOf().find(function (x) { return x.user_id === uid; }); return u ? u.name : uid; };
  const dirtyKeys = function () { return planDiffKeys(server, local); };
  const dirtyCount = function () { return mode === 'view' ? 0 : dirtyKeys().length; };
  const branchNameOf = function (id) { const b = branches.find(function (x) { return x.branch_id === id; }); return b ? String(b.name) : (id === me.branch_id ? (me.branch_name || id) : id); };

  /* 저장하지 않은 변경이 있으면 다른 달·지점으로 옮기지 못하게 막는다 */
  function guard() {
    if (dirtyCount() > 0) {
      note('warn', '저장하지 않은 변경이 ' + dirtyCount() + '칸 있어요. ' + (mode === 'change' ? '변경 요청을 보내거나 취소한 뒤' : '저장하거나 \'서버 상태로 되돌리기\'를 누른 뒤') + ' 이동해 주세요.');
      return false;
    }
    return true;
  }

  /* ---------- 불러오기 ---------- */
  async function load() {
    if (!branchId) { data = null; mode = 'view'; draw(); return; }
    const my = ++loadSeq;
    gridHost.replaceChildren(h('p', { class: 'sub' }, '불러오는 중…'));
    actionHost.replaceChildren();
    try {
      const res = await Promise.all([
        apiCall('getPlan', { branch_id: branchId, ym: ym }),
        apiCall('listWorkCodes', isHQ ? { branch_id: branchId } : {})
      ]);
      if (!ctx.isCurrent() || my !== loadSeq) return;
      const d = res[0], c = res[1];
      if (!d || !Array.isArray(d.users) || !Array.isArray(d.days) || !c || !Array.isArray(c.codes)) throw new ApiError('BAD_RESPONSE', '서버 응답 형식이 올바르지 않습니다.');
      data = d;
      codeList = c.codes;
      codeMeta = {};
      codeList.forEach(function (x) { codeMeta[String(x.code)] = x; });
      server = {}; snaps = {};
      d.days.forEach(function (x) {
        if (!x || !x.user_id || !okDate(x.date) || !x.code) return;
        const k = planKey(x.user_id, x.date);
        server[k] = String(x.code);
        if (x.snapshot) snaps[k] = x.snapshot;
      });
      local = Object.assign({}, server);
      const pl = d.plan;
      mode = planMonthEditable(ym, today) && (!pl || pl.status === 'DRAFT' || pl.status === 'REJECTED') ? 'edit' : 'view';
      brush = undefined;
      draw();
    } catch (x) {
      const e = wrapError(x);
      if (!ctx.isCurrent() || my !== loadSeq || handleCommonError(e)) return;
      gridHost.replaceChildren(errBlock(e, load));
    }
  }

  async function loadQueue() {
    if (!isHQ) return;
    const my = ++queueSeq;
    try {
      const res = await Promise.all([apiCall('listPlans', { status: 'SUBMITTED' }), apiCall('listPlanChanges', { status: 'PENDING' })]);
      if (!ctx.isCurrent() || my !== queueSeq) return;
      if (!res[0] || !Array.isArray(res[0].plans) || !res[1] || !Array.isArray(res[1].requests)) throw new ApiError('BAD_RESPONSE', '서버 응답 형식이 올바르지 않습니다.');
      drawQueue(res[0].plans, res[1].requests);
    } catch (x) {
      const e = wrapError(x);
      if (!ctx.isCurrent() || my !== queueSeq || handleCommonError(e)) return;
      queueHost.replaceChildren(h('section', { class: 'card' }, h('p', { class: 'msg bad', style: 'margin-top:0' }, '검토 대기 목록을 불러오지 못했어요. ' + e.message), h('button', { type: 'button', class: 'btn small', onclick: loadQueue }, '다시 시도')));
    }
  }
  const reloadAll = function () { loadQueue(); return load(); };

  function openTarget(bid, targetYm) {
    if (!guard()) return;
    branchId = bid; ym = targetYm;
    if (branchSel) branchSel.value = bid;
    noteHost.replaceChildren();
    load();
    try { headHost.scrollIntoView({ block: 'start' }); } catch (e) { /* 무시 */ }
  }

  function drawQueue(plans, reqs) {
    if (!plans.length && !reqs.length) {
      queueHost.replaceChildren(h('section', { class: 'card' }, h('h2', null, '검토 대기'), h('p', { class: 'sub' }, '검토를 기다리는 계획이나 변경 요청이 없어요.')));
      return;
    }
    const rows = [];
    plans.forEach(function (p) {
      rows.push(h('li', null,
        h('span', null, h('b', null, String(p.branch_name || branchNameOf(p.branch_id))), ' · ' + p.ym + ' 계획 제출', p.late ? h('span', { class: 'pill crit', style: 'margin-left:6px' }, '지연') : null),
        h('button', { type: 'button', class: 'btn small', 'aria-label': String(p.branch_name || p.branch_id) + ' ' + p.ym + ' 계획 열기', onclick: function () { openTarget(p.branch_id, p.ym); } }, '열기')));
    });
    reqs.forEach(function (r) {
      const n = Array.isArray(r.changes) ? r.changes.length : 0;
      rows.push(h('li', null,
        h('span', null, h('b', null, branchNameOf(r.branch_id)), ' · ' + r.ym + ' 변경 요청 ' + n + '건'),
        h('button', { type: 'button', class: 'btn small', 'aria-label': branchNameOf(r.branch_id) + ' ' + r.ym + ' 변경 요청 열기', onclick: function () { openTarget(r.branch_id, r.ym); } }, '열기')));
    });
    queueHost.replaceChildren(h('section', { class: 'card' }, h('h2', null, '검토 대기 ' + (plans.length + reqs.length) + '건'), h('ul', { class: 'queue' }, rows)));
  }

  /* ---------- 머리글: 달·지점·상태 ---------- */
  let branchSel = null;
  if (isHQ) {
    branchSel = selectInput('pl-branch', [['', '지점을 선택하세요']], '');
    branchSel.addEventListener('change', function () {
      if (!guard()) { branchSel.value = branchId; return; }
      branchId = branchSel.value; noteHost.replaceChildren(); load();
    });
  }
  const prevBtn = h('button', { type: 'button', class: 'btn small', 'aria-label': '이전 달' }, '‹');
  const nextBtn = h('button', { type: 'button', class: 'btn small', 'aria-label': '다음 달' }, '›');
  const monthLabel = h('b', { class: 'mono', 'aria-live': 'polite' });
  const statusLine = h('div', { class: 'acts', style: 'align-items:center;margin-top:10px' });
  prevBtn.addEventListener('click', function () { if (ym > minYm && guard()) { ym = addMonthStr(ym, -1); noteHost.replaceChildren(); load(); } });
  nextBtn.addEventListener('click', function () { if (ym < maxYm && guard()) { ym = addMonthStr(ym, 1); noteHost.replaceChildren(); load(); } });
  headHost.append(
    h('div', { class: 'toolbar' }, h('h2', null, '월간 근무계획'),
      isHQ ? h('div', { class: 'fld', style: 'margin-top:0' }, h('label', { for: 'pl-branch' }, '지점'), branchSel) : h('span', { class: 'sub' }, '지점: ' + (me.branch_name || me.branch_id))),
    h('div', { style: 'display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px' }, prevBtn, monthLabel, nextBtn),
    statusLine);

  function drawHead() {
    monthLabel.textContent = ym.slice(0, 4) + '년 ' + parseInt(ym.slice(5, 7), 10) + '월';
    prevBtn.disabled = ym <= minYm;
    nextBtn.disabled = ym >= maxYm;
    const kids = [];
    const pl = planOf();
    if (!branchId) { statusLine.replaceChildren(h('span', { class: 'sub' }, '지점을 선택하면 계획을 볼 수 있어요.')); return; }
    if (!pl) kids.push(h('span', { class: 'pill off' }, planMonthEditable(ym, today) ? '아직 입력 전' : '계획 없음'));
    else {
      kids.push(h('span', { class: 'pill ' + (pl.status === 'APPROVED' ? '' : pl.status === 'REJECTED' ? 'crit' : pl.status === 'SUBMITTED' ? 'info' : 'off') }, PLAN_STATUS_LABEL[pl.status] || String(pl.status)));
      if (pl.late) kids.push(h('span', { class: 'pill crit' }, '지연 제출'));
      if (pl.submitted_at && pl.status !== 'DRAFT') kids.push(h('span', { class: 'sub' }, '제출 ' + fmtStamp(pl.submitted_at)));
      if (pl.status === 'APPROVED' && pl.approved_at) kids.push(h('span', { class: 'sub' }, '승인 ' + fmtStamp(pl.approved_at)));
    }
    if (data && data.deadline && okDate(data.deadline) && (!pl || pl.status === 'DRAFT' || pl.status === 'REJECTED')) {
      const over = today > data.deadline;
      kids.push(h('span', { class: over ? 'pill crit' : 'sub' }, over ? '제출 마감(' + data.deadline.slice(5) + ')이 지났어요' : '제출 마감 ' + data.deadline.slice(5)));
    }
    statusLine.replaceChildren.apply(statusLine, kids);
  }

  /* ---------- 칸 그리기 ---------- */
  function cellEditable(uid, date) {
    const u = usersOf().find(function (x) { return x.user_id === uid; });
    if (!inWindow(u, date)) return false;
    if (mode === 'edit') return true;
    if (mode === 'change') return date >= today;
    return false;
  }
  function infoOf(k) {
    const code = local[k];
    if (!code) return null;
    if (snaps[k] && server[k] === code) return snaps[k];
    return codeMeta[code] || null;
  }
  function refreshCell(k) {
    const r = cellRefs[k];
    if (!r) return;
    const code = local[k] || '';
    const meta = code ? (snaps[k] && server[k] === code ? snaps[k] : codeMeta[code]) : null;
    r.btn.className = 'cell ' + (code ? codeCellClass(meta) : 'empty') + ((local[k] || '') !== (server[k] || '') ? ' dirty' : '');
    r.btn.textContent = code || '·';
    const base = nameOf(r.uid) + ' ' + fmtShortDate(r.date) + ' ';
    r.btn.setAttribute('aria-label', base + (code ? code + (meta && meta.name ? ' ' + meta.name : '') + (meta ? ' ' + codeDetailText(meta) : ' (사용할 수 없는 코드)') : '비어 있음') + (r.btn.className.indexOf('dirty') >= 0 ? ', 변경됨' : ''));
  }
  function refreshTotals() {
    usersOf().forEach(function (u) {
      const t = totalRefs[u.user_id];
      if (!t) return;
      let days = 0, min = 0;
      daysOfMonth(ym).forEach(function (d) {
        const inf = infoOf(planKey(u.user_id, d));
        if (inf && inf.type === 'WORK') { days++; min += Number(inf.net_min) || 0; }
      });
      t.textContent = days + '일 · ' + minutesText(min);
    });
  }
  function missingNow() { return planMissingCount(usersOf(), daysOfMonth(ym), local); }
  function updateSummary() {
    const dirty = dirtyCount();
    if (mode === 'edit' && summaryEl) {
      const miss = missingNow();
      summaryEl.textContent = (dirty ? '저장하지 않은 변경 ' + dirty + '칸 · ' : '') + '빈 칸 ' + miss + '칸';
      if (saveBtn) saveBtn.disabled = busy || dirty === 0;
      if (undoBtn) undoBtn.disabled = busy || dirty === 0;
      if (submitWrap) {
        const b = submitWrap.querySelector('button');
        if (b) { b.disabled = busy || dirty > 0 || miss > 0 || usersOf().length === 0; b.title = dirty > 0 ? '먼저 저장해 주세요.' : miss > 0 ? '빈 칸을 모두 채워야 제출할 수 있어요.' : ''; }
      }
    } else if (mode === 'change' && summaryEl) {
      summaryEl.textContent = '변경한 칸 ' + dirty + '칸 (최대 ' + PLAN_CHANGE_MAX + '칸)';
      if (sendBtn) sendBtn.disabled = busy || dirty === 0 || dirty > PLAN_CHANGE_MAX;
      if (undoBtn) undoBtn.disabled = busy;
    }
    refreshTotals();
  }
  function paint(uid, date) {
    if (brush === undefined) { note('warn', '먼저 위에서 근무코드를 고른 뒤 칸을 눌러 주세요.'); return; }
    if (!cellEditable(uid, date)) return;
    const k = planKey(uid, date);
    let want = brush;
    if (want === '') { want = mode === 'change' ? (server[k] || '') : ''; }
    if (want) local[k] = want; else delete local[k];
    refreshCell(k);
    updateSummary();
  }
  /* 이름·날짜를 누르면 선택한 코드로 '빈 칸'만 채운다 (이미 입력한 칸은 건드리지 않는다) */
  function fillEmpty(pairs) {
    if (brush === undefined || brush === '') { note('warn', '채우려면 먼저 위에서 근무코드를 고르세요. (빈 칸만 채우고 이미 입력한 칸은 그대로 둬요)'); return; }
    let n = 0;
    pairs.forEach(function (p) {
      const k = planKey(p.uid, p.date);
      if (!cellEditable(p.uid, p.date) || local[k]) return;
      local[k] = brush; refreshCell(k); n++;
    });
    note(n ? 'ok' : 'info', n ? '빈 칸 ' + n + '곳을 ' + brush + '로 채웠어요. 저장해야 반영돼요.' : '채울 빈 칸이 없어요.');
    updateSummary();
  }

  function buildGrid() {
    const users = usersOf();
    cellRefs = {}; totalRefs = {};
    if (!users.length) {
      return h('p', { class: 'msg warn', style: 'margin-top:8px' }, '이 달에 계획 대상 직원이 없어요. \'직원\' 탭에서 직원을 등록하거나 입사일·퇴직일을 확인해 주세요.');
    }
    const dates = daysOfMonth(ym);
    const fillable = mode === 'edit' || mode === 'change';
    const head = h('tr', null, h('th', { class: 'who-col', scope: 'col' }, '직원'),
      dates.map(function (d) {
        const w = dowOf(d);
        const inner = [h('span', null, String(parseInt(d.slice(8), 10))), h('span', { class: 'dow' }, w)];
        const cls = (w === '토' || w === '일' ? 'we ' : '') + (d === today ? 'tdy' : '');
        return h('th', { scope: 'col', class: cls.trim() },
          fillable && mode === 'edit' ? h('button', { type: 'button', class: 'colhead', 'aria-label': fmtShortDate(d) + ' 빈 칸 채우기', onclick: function () { fillEmpty(users.map(function (u) { return { uid: u.user_id, date: d }; })); } }, inner) : h('span', { class: 'colhead' }, inner));
      }),
      h('th', { scope: 'col', class: 'tot-col' }, '근무 (참고)'));
    const body = users.map(function (u) {
      const nameNode = fillable && mode === 'edit'
        ? h('button', { type: 'button', class: 'rowhead', 'aria-label': u.name + ' 빈 칸 채우기', onclick: function () { fillEmpty(dates.map(function (d) { return { uid: u.user_id, date: d }; })); } }, u.name)
        : h('span', { class: 'rowhead' }, u.name);
      const tot = h('td', { class: 'tot-col mono' });
      totalRefs[u.user_id] = tot;
      return h('tr', null,
        h('th', { class: 'who-col', scope: 'row' }, nameNode, u.role === 'GM' ? h('span', { class: 'dow' }, '총지배인') : null),
        dates.map(function (d) {
          if (!inWindow(u, d)) return h('td', { class: 'na', title: '재직 기간 밖' }, '–');
          const k = planKey(u.user_id, d);
          const btn = h('button', { type: 'button', class: 'cell' });
          cellRefs[k] = { btn: btn, uid: u.user_id, date: d };
          if (cellEditable(u.user_id, d)) btn.addEventListener('click', function () { paint(u.user_id, d); });
          else btn.disabled = true;
          refreshCell(k);
          return h('td', null, btn);
        }), tot);
    });
    return h('div', { class: 'scroll plan-scroll' }, h('table', { class: 'plangrid' }, h('thead', null, head), h('tbody', null, body)));
  }

  function drawLegend() {
    const list = codeList.filter(function (c) { return !c.error; });
    if (!list.length) return null;
    return h('div', { class: 'legend' }, list.map(function (c) {
      return h('span', { class: 'lg' }, h('b', { class: 'cell lg-code ' + codeCellClass(c) }, String(c.code)), ' ' + c.name + ' ', h('span', { class: 'sub' }, codeDetailText(c) + (c.active ? '' : ' · 사용 중지')));
    }));
  }

  /* ---------- 서버 호출 ---------- */
  async function mutate(action, params, okText) {
    if (busy) return;
    busy = true; updateSummary();
    try {
      await apiCall(action, params);
      if (!ctx.isCurrent()) return;
      note('ok', okText);
      busy = false;
      await reloadAll();
    } catch (x) {
      const e = wrapError(x);
      if (handleCommonError(e)) return;
      note('bad', e.message + (e.uncertain ? ' 처리되었을 수 있으니 아래 상태를 확인해 주세요.' : ''));
      busy = false;
      reloadAll();
    } finally {
      busy = false;
      if (ctx.isCurrent()) updateSummary();
    }
  }

  async function save() {
    if (busy) return;
    const keys = dirtyKeys();
    if (!keys.length) return;
    const items = keys.map(function (k) { const p = splitPlanKey(k); return { user_id: p.user_id, date: p.date, code: local[k] || '' }; });
    busy = true; updateSummary();
    saveBtn.textContent = '저장 중…';
    try {
      const parts = chunkList(items, PLAN_BATCH_MAX);
      for (let i = 0; i < parts.length; i++) await apiCall('setPlanDays', { branch_id: branchId, ym: ym, days: parts[i] });
      if (!ctx.isCurrent()) return;
      busy = false;
      note('ok', items.length + '칸을 저장했어요. 모두 채웠다면 \'본사에 제출\'을 눌러 주세요.');
      await load();
    } catch (x) {
      const e = wrapError(x);
      if (handleCommonError(e)) return;
      if (e.code === 'CONFLICT' || e.code === 'NOT_FOUND') {
        note('bad', e.message + ' 최신 상태를 다시 불러왔어요. 화면의 변경은 반영되지 않았어요.');
        busy = false; reloadAll(); return;
      }
      note('bad', e.message + (e.uncertain ? ' 저장되었는지 확인하려면 \'서버 상태로 되돌리기\'를 눌러 주세요. (눌러도 입력한 내용은 저장된 만큼만 남아요)' : ' 입력한 내용은 그대로 두었어요. 고친 뒤 다시 저장해 주세요.'));
    } finally {
      busy = false;
      if (ctx.isCurrent()) { if (saveBtn) saveBtn.textContent = '저장'; updateSummary(); }
    }
  }

  async function sendChange() {
    if (busy) return;
    const reason = cleanText(changeReason.value);
    const rp = textProblem(reason, '변경 사유', 2, 200);
    if (rp) { setInvalid(changeReason, true); changeReason.focus(); note('bad', rp); return; }
    setInvalid(changeReason, false);
    const keys = dirtyKeys().filter(function (k) { return !!local[k]; });
    if (!keys.length) { note('bad', '변경할 칸이 없어요.'); return; }
    if (keys.length > PLAN_CHANGE_MAX) { note('bad', '한 번에 최대 ' + PLAN_CHANGE_MAX + '칸까지 요청할 수 있어요.'); return; }
    const changes = keys.map(function (k) { const p = splitPlanKey(k); return { user_id: p.user_id, date: p.date, code: local[k] }; });
    await mutate('requestPlanChange', { plan_id: planOf().plan_id, reason: reason, changes: changes }, '변경 요청 ' + changes.length + '건을 본사에 보냈어요.');
  }

  /* ---------- 상태별 작업 영역 ---------- */
  function paletteNode() {
    const mk = function (value, label, sub) {
      const b = h('button', { type: 'button', class: 'btn small brushbtn', 'aria-pressed': 'false' }, h('b', { class: 'mono' }, label), sub ? h('span', { class: 'sub', style: 'margin-left:4px' }, sub) : null);

      kids.push(h('section', { class: 'card' },

      kids.push(h('section', { class: 'card formcard' }, h('h2', null, '변경 요청'),
        h('p', { class: 'sub', style: 'margin:0 0 8px' }, '승인된 계획은 직접 고칠 수 없어요. 오늘 이후 날짜만 바꿔서 본사에 요청해요. 본사가 승인하면 반영되고 근무시간이 다시 확정돼요.'),

          kids.push(h('section', { class: 'card formcard' }, h('h2', null, '이 계획을 검토해 주세요'),
            h('p', { class: 'sub' }, '제출 ' + nameOf(pl.submitted_by) + (pl.submitted_at ? ' · ' + fmtStamp(pl.submitted_at) : '') + '. 승인하면 근무시간이 확정(스냅샷)돼 이후 코드가 바뀌어도 이 달 계획은 그대로예요.'),
            h('div', { class: 'acts' },
              confirmAction('승인', '승인하면 직원 출퇴근의 기준이 되고, 직접 수정할 수 없게 돼요.', function () { return mutate('approvePlan', { plan_id: pl.plan_id }, ym + ' 계획을 승인했어요.'); }),
              h('button', { type: 'button', class: 'btn small', onclick: function () {
                if (rejectHost.firstChild) { rejectHost.replaceChildren(); return; }
                rejectHost.append(reasonForm('pl-reject', '반려 사유', '계획 반려', function (v) { return mutate('rejectPlan', { plan_id: pl.plan_id, reason: v }, ym + ' 계획을 반려했어요.'); }));
                const t = rejectHost.querySelector('textarea'); if (t) t.focus();
              } }, '반려')), rejectHost));
        } else {
          kids.push(h('p', { class: 'msg info', style: 'margin-top:0' }, '본사가 검토 중이에요. 승인되거나 반려될 때까지 수정할 수 없어요.'));
        }

        else if (ym >= curYm) {
          kids.push(h('section', { class: 'card' },
            h('p', { class: 'sub', style: 'margin:0 0 8px' }, '승인된 계획이에요. 바꿔야 한다면 오늘 이후 날짜에 한해 변경을 요청할 수 있어요.'),
            h('button', { type: 'button', class: 'btn', onclick: function () { mode = 'change'; brush = undefined; local = Object.assign({}, server); draw(); } }, '변경 요청 시작')));
        }

    } else if (!planMonthEditable(ym, today)) {
      kids.push(h('p', { class: 'msg info', style: 'margin-top:0' }, ym < curYm ? '지난 달에는 입력된 계획이 없어요. (입력은 당월부터 2개월 후까지만 가능해요)' : '아직 입력할 수 없는 달이에요.'));
    }
    actionHost.replaceChildren.apply(actionHost, kids);
  }

  function draw() {
    drawHead();
    drawActions();
    if (!branchId) {
      gridHost.replaceChildren(isHQ ? h('p', { class: 'sub' }, '위에서 지점을 고르거나 검토 대기 목록에서 \'열기\'를 눌러 주세요.') : '');

      h('p', { class: 'sub', style: 'margin:8px 0 0' }, '오른쪽 \'근무\'는 근무 코드만 합산한 참고 값이에요. 휴가의 근무시간 환산 기준은 아직 정해지지 않아 포함하지 않아요.'), legend));
    updateSummary();
  }

  /* ---------- 시작 ---------- */
  if (isHQ) {
    apiCall('listBranches').then(function (r) {
      if (!ctx.isCurrent()) return;
      if (!r || !Array.isArray(r.branches)) throw new ApiError('BAD_RESPONSE', '서버 응답 형식이 올바르지 않습니다.');
      branches = r.branches;
      branchSel.replaceChildren.apply(branchSel, [h('option', { value: '' }, '지점을 선택하세요')].concat(branches.map(function (b) { return h('option', { value: b.branch_id }, String(b.name) + (b.status === 'ACTIVE' ? '' : ' (중지)')); })));
      branchSel.value = branchId;
    }).catch(function (x) {
      const e = wrapError(x);
      if (!ctx.isCurrent() || handleCommonError(e)) return;
      note('bad', '지점 목록을 불러오지 못했어요. ' + e.message);
    });
    loadQueue();
  }
  draw();
  load();
}

/* ===================== 7-5: 오늘 현황 · 근태 검토/정정 (순수 계산 도우미) ===================== */
const ATT_REASON_TEXT = { OUT_OF_RANGE: '위치 반경 밖', LOW_ACCURACY: 'GPS 정확도 낮음', NO_APPROVED_PLAN: '승인된 계획 없음' };
const TODAY_STATUS = {
  WORKING: { label: '근무 중', tone: 'ok' }, DONE: { label: '퇴근', tone: '' }, BEFORE: { label: '출근 전', tone: 'off' },
  ABSENT: { label: '출근 기록 없음', tone: 'crit' }, OPEN_PREV: { label: '전날 퇴근 미기록', tone: 'crit' },
  OFF: { label: '휴무', tone: 'off' }, LEAVE: { label: '휴가', tone: 'off' }, NO_PLAN: { label: '계획 미승인', tone: 'warn' }, NO_DAY: { label: '일정 없음', tone: 'warn' }
};
function hmToMinutes(hm) {
  const m = /^(\d{2}):(\d{2})$/.exec(String(hm || ''));
  return m ? parseInt(m[1], 10) * 60 + parseInt(m[2], 10) : NaN;
}
function kstNowHM() { const p = kstParts(Date.now()); return pad2(p.hh) + ':' + pad2(p.mm); }
/* 계획 시작 시각 대비 실제 출근(분): 양수 = 늦음. 지각 여부는 판단하지 않고 사실만 보여 준다. */
function diffText(min) {
  if (min == null || !Number.isFinite(Number(min))) return '';
  const n = Math.round(Number(min));
  return n === 0 ? '계획 시각 정각' : '계획보다 ' + Math.abs(n) + '분 ' + (n > 0 ? '늦음' : '빠름');
}
/* 오늘 한 사람의 상태. sched = 승인된 계획 칸(snapshot 포함) 또는 null, planApproved = 이 달 계획이 승인됐는지 */
function todayRowStatus(o) {
  if (o.openPrev) return 'OPEN_PREV';
  if (o.rec) return o.rec.open ? 'WORKING' : 'DONE';
  if (!o.planApproved) return 'NO_PLAN';
  const s = o.sched && o.sched.snapshot;
  if (!s) return 'NO_DAY';
  if (s.type === 'OFF') return 'OFF';
  if (s.type === 'LEAVE') return 'LEAVE';
  if (s.type === 'WORK') {
    const st = hmToMinutes(s.start), now = hmToMinutes(o.nowHM);
    return Number.isFinite(st) && Number.isFinite(now) && now >= st ? 'ABSENT' : 'BEFORE';
  }
  return 'NO_DAY';
}
function attReasonsText(list) {
  return (Array.isArray(list) ? list : []).map(function (x) { return ATT_REASON_TEXT[x] || x; }).join(', ');
}
/* 입력한 근무일·시각이 지금(KST)보다 미래인지 */
function isFutureKst(date, hm, nowDate, nowHM) {
  return date > nowDate || (date === nowDate && hm > nowHM);
}
function nextDateStr(d) {
  const t = new Date(d + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + 1);
  return t.toISOString().slice(0, 10);
}
function daysApart(a, b) {
  return Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 86400000);
}

/* ===================== 7-5: 오늘 현황 ===================== */
function renderToday(host, ctx) {
  const me = ctx.user;
  const isHQ = me.role === 'HQ';
  const today = kstTodayStr();
  const yesterday = new Date(Date.parse(today + 'T00:00:00Z') - 86400000).toISOString().slice(0, 10);
  const ym = today.slice(0, 7);
  const wrap = h('div', { class: 'stack' });
  host.append(wrap);
  const noteHost = h('div');
  const summaryHost = h('div');
  const body = h('div', { class: 'stack' });
  const stamp = h('span', { class: 'sub', role: 'status' });
  const refresh = h('button', { type: 'button', class: 'btn small' }, '새로 고침');
  wrap.append(h('section', { class: 'card' }, h('div', { class: 'toolbar' }, h('h2', null, (isHQ ? '전 지점 현황' : '오늘 현황') + ' · ' + fmtDateLabel(today)), h('div', { class: 'acts', style: 'align-items:center' }, stamp, refresh)),
    h('p', { class: 'sub', style: 'margin:6px 0 0' }, '승인된 월간 계획과 오늘의 출퇴근 기록을 맞춰 보여줘요. 자동으로 갱신되지 않으니 필요할 때 \'새로 고침\'을 눌러 주세요.')), noteHost, summaryHost, body);

  let loadSeq = 0;
  let busy = false;
  refresh.addEventListener('click', function () { if (!busy) load(); });

  async function load() {
    const my = ++loadSeq;
    busy = true; refresh.disabled = true;
    body.replaceChildren(h('p', { class: 'sub' }, '불러오는 중…'));
    summaryHost.replaceChildren(); noteHost.replaceChildren();
    try {
      let branchList;
      if (isHQ) {
        const br = await apiCall('listBranches');
        if (!ctx.isCurrent() || my !== loadSeq) return;
        if (!br || !Array.isArray(br.branches)) throw new ApiError('BAD_RESPONSE', '서버 응답 형식이 올바르지 않습니다.');
        branchList = br.branches.filter(function (b) { return b.status === 'ACTIVE'; });
      } else {
        branchList = [{ branch_id: me.branch_id, name: me.branch_name || me.branch_id, status: 'ACTIVE' }];
      }
      const att = await apiCall('listAttendance', { from: yesterday, to: today, filter: 'ALL' });
      if (!ctx.isCurrent() || my !== loadSeq) return;
      if (!att || !Array.isArray(att.records)) throw new ApiError('BAD_RESPONSE', '서버 응답 형식이 올바르지 않습니다.');
      const plans = await Promise.all(branchList.map(function (b) {
        return apiCall('getPlan', { branch_id: b.branch_id, ym: ym }).then(function (r) { return { b: b, r: r }; }, function (x) { return { b: b, err: wrapError(x) }; });
      }));
      if (!ctx.isCurrent() || my !== loadSeq) return;
      const authLost = plans.map(function (p) { return p.err; }).find(function (e) { return e && handleCommonError(e); });
      if (authLost) return;
      draw(branchList, att, plans);
    } catch (x) {
      const e = wrapError(x);
      if (!ctx.isCurrent() || my !== loadSeq || handleCommonError(e)) return;
      body.replaceChildren(errBlock(e, load));
    } finally {
      if (my === loadSeq) { busy = false; refresh.disabled = false; }
    }
  }

  function draw(branchList, att, plans) {
    const nowHM = kstNowHM();
    stamp.textContent = '기준 ' + nowHM;
    if (att.truncated) noteHost.replaceChildren(h('p', { class: 'msg warn', style: 'margin-top:0' }, '기록이 너무 많아 일부만 보여요. 지점별로 나눠 확인해 주세요.'));
    const totals = { WORKING: 0, BEFORE: 0, ABSENT: 0, OPEN_PREV: 0, DONE: 0, REVIEW: 0 };
    const sections = plans.map(function (pp) {
      const bid = pp.b.branch_id;
      const head = h('h3', { style: 'margin:0 0 6px' }, String(pp.b.name));
      if (pp.err) return h('section', { class: 'card' }, head, h('p', { class: 'msg bad', style: 'margin-top:0' }, '이 지점 계획을 불러오지 못했어요. ' + pp.err.message));
      const r = pp.r;
      if (!r || !Array.isArray(r.users) || !Array.isArray(r.days)) return h('section', { class: 'card' }, head, h('p', { class: 'msg bad', style: 'margin-top:0' }, '서버 응답 형식이 올바르지 않습니다.'));
      const approved = !!(r.plan && r.plan.status === 'APPROVED');
      const recs = att.records.filter(function (x) { return x.branch_id === bid; });
      const rows = [];
      const known = {};
      r.users.forEach(function (u) {
        known[u.user_id] = true;
        const rec = recs.find(function (x) { return x.user_id === u.user_id && x.work_date === today; }) || null;
        const prev = recs.find(function (x) { return x.user_id === u.user_id && x.work_date !== today && x.open; }) || null;
        const sched = r.days.find(function (d) { return d.user_id === u.user_id && d.date === today; }) || null;
        const key = todayRowStatus({ planApproved: approved, sched: sched, rec: rec, openPrev: prev, nowHM: nowHM });
        rows.push({ name: u.name, role: u.role, sched: sched, rec: rec, prev: prev, key: key });
      });
      recs.forEach(function (x) { // 계획에 없는 사람의 기록(정정으로 생성되었거나 재직 기간 변경)
        if (!known[x.user_id] && x.work_date === today) rows.push({ name: x.user_name || x.user_id, role: '', sched: null, rec: x, prev: null, key: x.open ? 'WORKING' : 'DONE' });
      });
      rows.forEach(function (x) {

      });
      const planNote = !r.plan ? '이 달 계획이 아직 없어요.' : approved ? '' : '이 달 계획이 아직 승인되지 않아 예정 근무를 알 수 없어요. (' + (PLAN_STATUS_LABEL[r.plan.status] || r.plan.status) + ')';
      const trs = rows.map(function (x) {
