        const pills = [h('span', { class: 'pill ' + st.tone }, st.label)];
        if (x.rec && x.rec.review_status === 'PENDING') pills.push(h('span', { class: 'pill warn', title: attReasonsText(x.rec.review_reasons) }, '확인 대기'));
        if (x.rec && x.rec.late === true) pills.push(h('span', { class: 'pill warn' }, '지각'));
        const diff = x.rec ? diffText(x.rec.in_diff_min) : '';
        return h('tr', null,
          h('td', null, h('b', null, x.name), x.role === 'GM' ? h('div', { class: 'sub' }, '총지배인') : null),
          h('td', null, planTxt),
          h('td', { class: 'mono' }, x.rec ? fmtHM(x.rec.in_at) : (x.prev ? fmtShortDate(x.prev.work_date) + ' ' + fmtHM(x.prev.in_at) : '-'), diff ? h('div', { class: 'sub' }, diff) : null),
          h('td', { class: 'mono' }, x.rec && x.rec.out_at ? fmtHM(x.rec.out_at) : '-'),
          h('td', null, h('div', { class: 'acts' }, pills), x.rec && x.rec.review_status === 'PENDING' ? h('div', { class: 'sub' }, attReasonsText(x.rec.review_reasons)) : null));
      });
      return h('section', { class: 'card' }, head, planNote ? h('p', { class: 'msg warn', style: 'margin-top:0' }, planNote) : null,
        rows.length ? h('div', { class: 'scroll' }, h('table', { class: 't' }, h('thead', null, h('tr', null, ['직원', '예정', '출근', '퇴근', '상태'].map(function (t) { return h('th', null, t); }))), h('tbody', null, trs)))
          : h('p', { class: 'sub' }, '오늘 계획 대상 직원이 없어요.'));
    });
    summaryHost.replaceChildren(h('section', { class: 'card' }, h('div', { class: 'acts', style: 'align-items:center' },
      h('span', { class: 'pill ok' }, '근무 중 ' + totals.WORKING), h('span', { class: 'pill off' }, '출근 전 ' + totals.BEFORE),
      h('span', { class: 'pill ' + (totals.ABSENT ? 'crit' : 'off') }, '출근 기록 없음 ' + totals.ABSENT),
      h('span', { class: 'pill ' + (totals.OPEN_PREV ? 'crit' : 'off') }, '전날 퇴근 미기록 ' + totals.OPEN_PREV),
      h('span', { class: 'pill' }, '퇴근 ' + totals.DONE),
      h('span', { class: 'pill ' + (totals.REVIEW ? 'warn' : 'off') }, '확인 대기 ' + totals.REVIEW),
      totals.REVIEW + totals.OPEN_PREV + totals.ABSENT > 0 ? h('button', { type: 'button', class: 'btn small', onclick: function () { ctx.go('review'); } }, '근태 검토로 이동') : null)));
    body.replaceChildren.apply(body, sections);
  }

  load();
}

/* ===================== 7-5: 근태 검토 · 정정 ===================== */
function renderReview(host, ctx) {
  const me = ctx.user;
  const isHQ = me.role === 'HQ';
  const today = kstTodayStr();
  let branchId = isHQ ? '' : me.branch_id;
  let from = today.slice(0, 7) + '-01';
  let to = today;
  let filter = 'REVIEW';
  let nameQ = '';
  let records = [];
  let truncated = false;
  let branches = [];
  let loadSeq = 0;
  let busy = false;

  const wrap = h('div', { class: 'stack' });
  host.append(wrap);
  const noteHost = h('div');
  const formHost = h('div');
  const listHost = h('div', null, h('p', { class: 'sub' }, '불러오는 중…'));
  const branchSel = isHQ ? selectInput('rv-branch', [['', '전체 지점']], '') : null;
  const fromIn = h('input', { id: 'rv-from', type: 'date' });
  const toIn = h('input', { id: 'rv-to', type: 'date' });
  const filterSel = selectInput('rv-filter', [['REVIEW', '확인 대기'], ['OPEN', '퇴근 미기록'], ['ALL', '전체']], 'REVIEW');
  const nameIn = textInput('rv-name', { maxlength: '30', placeholder: '이름 일부' });
  fromIn.value = from; toIn.value = to;
  const applyBtn = h('button', { type: 'button', class: 'btn primary small' }, '조회');
  const addBtn = h('button', { type: 'button', class: 'btn small' }, '누락 기록 추가');
  wrap.append(h('section', { class: 'card' }, h('div', { class: 'toolbar' }, h('h2', null, '근태 검토 · 정정'), addBtn),
    h('div', { class: 'row2' }, fieldBox('rv-from', '시작일', fromIn), fieldBox('rv-to', '종료일', toIn)),
    h('div', { class: 'row2' }, isHQ ? fieldBox('rv-branch', '지점', branchSel) : null, fieldBox('rv-filter', '보기', filterSel)),
    fieldBox('rv-name', '직원 이름', nameIn), h('div', { class: 'formbtns' }, applyBtn)), noteHost, formHost, h('section', { class: 'card' }, listHost));

  function note(kind, text) {
    noteHost.replaceChildren(h('p', { class: 'msg ' + kind, role: 'status', style: 'margin-top:0' }, text));
    announce(text);
  }
  function readFilters() {
    const f = fromIn.value, t = toIn.value;
    if (!okDate(f) || !okDate(t)) { note('bad', '조회 기간(시작일·종료일)을 입력해 주세요.'); return false; }
    if (f > t) { note('bad', '시작일이 종료일보다 늦어요.'); return false; }
    if (daysApart(f, t) > 61) { note('bad', '한 번에 최대 62일까지 조회할 수 있어요.'); return false; }
    from = f; to = t; filter = filterSel.value; nameQ = cleanText(nameIn.value);
    if (isHQ) branchId = branchSel.value;
    return true;
  }
  applyBtn.addEventListener('click', function () { if (!busy && readFilters()) { noteHost.replaceChildren(); load(); } });

  async function load() {
    const my = ++loadSeq;
    busy = true; applyBtn.disabled = true;
    listHost.replaceChildren(h('p', { class: 'sub' }, '불러오는 중…'));
    try {
      const params = { from: from, to: to, filter: filter };
      if (isHQ && branchId) params.branch_id = branchId;
      const r = await apiCall('listAttendance', params);
      if (!ctx.isCurrent() || my !== loadSeq) return;
      if (!r || !Array.isArray(r.records)) throw new ApiError('BAD_RESPONSE', '서버 응답 형식이 올바르지 않습니다.');
      records = r.records; truncated = !!r.truncated;
      draw();
    } catch (x) {
      const e = wrapError(x);
      if (!ctx.isCurrent() || my !== loadSeq || handleCommonError(e)) return;
      listHost.replaceChildren(errBlock(e, load));
    } finally {
      if (my === loadSeq) { busy = false; applyBtn.disabled = false; }
    }
  }

  function draw() {
    const q = nameQ.toLowerCase();
    const list = records.filter(function (r) { return !q || String(r.user_name || '').toLowerCase().indexOf(q) >= 0; });
    const kids = [];
    if (truncated) kids.push(h('p', { class: 'msg warn', style: 'margin-top:0' }, '기록이 너무 많아 일부만 보여요. 기간이나 지점을 좁혀 주세요.'));
    if (!list.length) {
      kids.push(h('p', { class: 'sub' }, filter === 'REVIEW' ? '확인할 기록이 없어요. 위치 이탈이나 승인 전 계획으로 표시된 기록이 없다는 뜻이에요.' : '조건에 맞는 기록이 없어요.'));
      listHost.replaceChildren.apply(listHost, kids); return;
    }
    kids.push(h('p', { class: 'sub', style: 'margin:0 0 6px' }, list.length + '건'));
    const trs = list.map(function (r) {
      const pills = [];
      if (r.open) pills.push(h('span', { class: 'pill ' + (r.stale ? 'crit' : 'warn') }, r.stale ? '퇴근 미기록(오래됨)' : '근무 중'));
      if (r.late === true) pills.push(h('span', { class: 'pill warn' }, '지각'));
      if (r.review_status === 'PENDING') pills.push(h('span', { class: 'pill warn' }, '확인 대기'));
      else if (r.review_status === 'CONFIRMED') pills.push(h('span', { class: 'pill' }, '확인됨'));
      if (r.source === 'MANUAL') pills.push(h('span', { class: 'pill info' }, '수기 입력'));
      const extra = [];
      if (r.review_reasons && r.review_reasons.length) extra.push(attReasonsText(r.review_reasons));
      if (Number.isFinite(Number(r.in_dist_m)) && r.in_dist_m != null) extra.push('출근 거리 약 ' + r.in_dist_m + 'm');
      if (Number.isFinite(Number(r.out_dist_m)) && r.out_dist_m != null) extra.push('퇴근 거리 약 ' + r.out_dist_m + 'm');
      const dtx = diffText(r.in_diff_min);
      if (dtx) extra.push(dtx);
      if (r.review_note) extra.push('메모: ' + r.review_note);
      if (r.correct_reason) extra.push('정정 사유: ' + r.correct_reason);
      return h('tr', null,
        h('td', null, fmtShortDate(r.work_date)),
        h('td', null, h('b', null, r.user_name || r.user_id), r.plan ? h('div', { class: 'sub' }, r.plan.code + ' ' + r.plan.start + '–' + r.plan.end) : (r.plan_state === 'UNAPPROVED' ? h('div', { class: 'sub' }, '승인 전 계획') : null)),
        h('td', { class: 'mono' }, fmtHM(r.in_at) + ' ~ ' + (r.out_at ? fmtHM(r.out_at) : '-'), r.work_min != null ? h('div', { class: 'sub' }, fmtDur(r.work_min)) : null),
        h('td', null, h('div', { class: 'acts' }, pills), extra.length ? h('div', { class: 'sub' }, extra.join(' · ')) : null),
        h('td', { class: 'acts-cell' }, h('div', { class: 'acts' },
          h('button', { type: 'button', class: 'btn small', 'aria-label': (r.user_name || r.user_id) + ' ' + fmtShortDate(r.work_date) + ' 확인', onclick: function () { openReview(r); } }, '확인'),
          h('button', { type: 'button', class: 'btn small', 'aria-label': (r.user_name || r.user_id) + ' ' + fmtShortDate(r.work_date) + ' 정정', onclick: function () { openCorrect(r); } }, '정정'))));
    });
    kids.push(h('div', { class: 'scroll' }, h('table', { class: 't' }, h('thead', null, h('tr', null, ['날짜', '직원', '출근 ~ 퇴근', '상태', ''].map(function (t) { return h('th', null, t); }))), h('tbody', null, trs))));
    listHost.replaceChildren.apply(listHost, kids);
  }

  /* ---------- 공통: 저장 폼 껍데기 ---------- */
  function formBox(title, bodyKids, action, okText, collect, submitLabel) {
    let sending = false;
    const err = h('p', { role: 'alert', hidden: true });
    const save = h('button', { type: 'submit', class: 'btn primary' }, submitLabel);
    const form = h('form', {
      novalidate: true,
      onsubmit: async function (ev) {
        ev.preventDefault();
        if (sending) return;
        err.hidden = true;
        const p = collect(function (el, m) { if (el) { setInvalid(el, true); el.focus(); } showMsg(err, m); });
        if (!p) return;
        sending = true; save.disabled = true; save.textContent = '저장 중…';
        try {
          await apiCall(action, p);
          if (!ctx.isCurrent()) return;
          formHost.replaceChildren();
          note('ok', okText);
          load();
        } catch (x) {
          const e = wrapError(x);
          if (handleCommonError(e)) return;
          showMsg(err, e.message + (e.uncertain ? ' 처리되었을 수 있으니 목록을 다시 조회해 주세요.' : ''));
          if (e.uncertain) load();
        } finally {
          sending = false; save.disabled = false; save.textContent = submitLabel;
        }
      }
    }, bodyKids, err, h('div', { class: 'formbtns' }, save, h('button', { type: 'button', class: 'btn', onclick: function () { formHost.replaceChildren(); } }, '취소')));
    formHost.replaceChildren(h('section', { class: 'card formcard' }, h('h2', null, title), form));
    try { form.querySelector('input,select,textarea').focus(); } catch (e) { /* 무시 */ }
    try { formHost.scrollIntoView({ block: 'nearest' }); } catch (e) { /* 무시 */ }
  }
  const lateSelect = function (cur) { return selectInput('rv-late', [['', '지각 여부 그대로'], ['Y', '지각'], ['N', '지각 아님']], cur === true ? 'Y' : cur === false ? 'N' : ''); };

  /* ---------- 확인(검토 완료) ---------- */
  function openReview(r) {
    const late = lateSelect(r.late);
    const memo = textInput('rv-note', { maxlength: '200', placeholder: '선택' });
    memo.value = r.review_note || '';
    const kids = [
      h('p', { class: 'sub', style: 'margin:8px 0 0' }, (r.user_name || r.user_id) + ' · ' + fmtDateLabel(r.work_date) + ' · ' + fmtHM(r.in_at) + ' ~ ' + (r.out_at ? fmtHM(r.out_at) : '-') + (r.review_reasons && r.review_reasons.length ? ' · ' + attReasonsText(r.review_reasons) : '')),
      fieldBox('rv-late', '지각 여부', late, '계획 출근 시각과 얼마나 차이 나는지는 위 표에 나와요. 지각으로 볼지는 여기서 직접 정해요.'),
      fieldBox('rv-note', '확인 메모', memo)
    ];
    formBox('기록 확인', kids, 'reviewAttendance', fmtShortDate(r.work_date) + ' ' + (r.user_name || '') + ' 기록을 확인 처리했어요.', function (bad) {
      setInvalid(memo, false);
      const nm = cleanText(memo.value);
      const np = nm ? textProblem(nm, '확인 메모', 1, 200) : '';
      if (np) return bad(memo, np), null;
      const p = { att_id: r.att_id };
      const curLate = r.late === true ? 'Y' : r.late === false ? 'N' : '';
      if (late.value && late.value !== curLate) p.late = late.value;
      if (nm !== cleanText(r.review_note || '')) p.note = nm;
      if (r.review_status === 'CONFIRMED' && p.late === undefined && p.note === undefined) return bad(null, '이미 확인된 기록이에요. 바꿀 내용이 없어요.'), null;
      return p;
    }, '확인 처리');
  }

  /* ---------- 정정 · 누락 기록 추가 ---------- */
  async function openCorrect(r) {
    const editing = !!r;
    formHost.replaceChildren(h('section', { class: 'card' }, h('p', { class: 'sub' }, '불러오는 중…')));
    let users;
    try {
      const bid = editing ? (r.branch_id || branchId) : branchId;
      const res = await apiCall('listUsers', isHQ && bid ? { branch_id: bid } : {});
      if (!ctx.isCurrent()) return;
      if (!res || !Array.isArray(res.users)) throw new ApiError('BAD_RESPONSE', '서버 응답 형식이 올바르지 않습니다.');
      users = res.users.filter(function (u) { return u.role !== 'HQ' && (u.status === 'ACTIVE' || (editing && u.user_id === r.user_id)); });
    } catch (x) {
      const e = wrapError(x);
      if (!ctx.isCurrent() || handleCommonError(e)) return;
      formHost.replaceChildren(h('section', { class: 'card' }, h('p', { class: 'msg bad', style: 'margin-top:0' }, e.message)));
      return;
    }
    if (!users.length) { formHost.replaceChildren(h('section', { class: 'card' }, h('p', { class: 'msg warn', style: 'margin-top:0' }, isHQ && !branchId && !editing ? '누락 기록을 추가하려면 위에서 지점을 먼저 고르고 \'조회\'를 눌러 주세요.' : '정정할 수 있는 직원이 없어요.'))); return; }
    const userSel = selectInput('rv-user', users.map(function (u) { return [u.user_id, u.name + (u.role === 'GM' ? ' (총지배인)' : '')]; }), editing ? r.user_id : users[0].user_id);
    if (editing) userSel.disabled = true;
    const dateIn = h('input', { id: 'rv-date', type: 'date', max: today });
    const inIn = h('input', { id: 'rv-in', type: 'time' });
    const outIn = h('input', { id: 'rv-out', type: 'time' });
    const nextDay = h('input', { id: 'rv-nextday', type: 'checkbox' });
    const late = lateSelect(editing ? r.late : null);
    const reason = h('textarea', { id: 'rv-reason', rows: '2', maxlength: '200', style: 'width:100%' });
    if (editing) {
      dateIn.value = r.work_date; dateIn.disabled = true;
      inIn.value = fmtHM(r.in_at) === '-' ? '' : fmtHM(r.in_at);
      if (r.out_at) { outIn.value = fmtHM(r.out_at); nextDay.checked = String(r.out_at).slice(0, 10) !== r.work_date; }
    }
    const kids = [
      fieldBox('rv-user', '직원', userSel), fieldBox('rv-date', '근무일', dateIn),
      h('div', { class: 'row2' }, fieldBox('rv-in', '출근', inIn), fieldBox('rv-out', '퇴근 (없으면 비움)', outIn)),
      h('label', { class: 'chk sub', for: 'rv-nextday' }, nextDay, '퇴근이 다음 날이에요 (야간 근무)'),
      fieldBox('rv-late', '지각 여부', late), fieldBox('rv-reason', '정정 사유 (필수)', reason, '감사 기록에 남아요. 예) 단말기 오류로 출근 버튼을 누르지 못함')
    ];
    formBox(editing ? '기록 정정 · ' + (r.user_name || '') + ' ' + fmtShortDate(r.work_date) : '누락 기록 추가', kids, 'correctAttendance',
      editing ? '기록을 정정했어요.' : '기록을 추가했어요.', function (bad) {
        [dateIn, inIn, outIn, reason].forEach(function (el) { setInvalid(el, false); });
        const wd = dateIn.value;
        if (!okDate(wd)) return bad(dateIn, '근무일을 입력해 주세요.'), null;
        if (wd > today) return bad(dateIn, '미래 날짜는 정정할 수 없어요.'), null;
        if (!/^\d{2}:\d{2}$/.test(inIn.value)) return bad(inIn, '출근 시각을 입력해 주세요.'), null;
        const inDate = wd;
        const hasOut = !!outIn.value;
        if (hasOut && !/^\d{2}:\d{2}$/.test(outIn.value)) return bad(outIn, '퇴근 시각 형식이 올바르지 않아요.'), null;
        const outDate = nextDay.checked ? nextDateStr(wd) : wd;
        const nowD = kstTodayStr(), nowT = kstNowHM();
        if (isFutureKst(inDate, inIn.value, nowD, nowT)) return bad(inIn, '현재 시각 이후로는 입력할 수 없어요.'), null;
        if (hasOut) {
          if (isFutureKst(outDate, outIn.value, nowD, nowT)) return bad(outIn, '현재 시각 이후로는 입력할 수 없어요.'), null;
          const a = Date.parse(inDate + 'T' + inIn.value + ':00+09:00'), b = Date.parse(outDate + 'T' + outIn.value + ':00+09:00');
          if (b <= a) return bad(outIn, '퇴근 시각은 출근 시각보다 늦어야 해요. 야간 근무라면 \'다음 날\'에 체크해 주세요.'), null;
          if (b - a > 24 * 3600000) return bad(outIn, '출근과 퇴근 간격은 24시간을 넘을 수 없어요.'), null;
        } else if (editing && r.out_at) return bad(outIn, '이미 기록된 퇴근 시각은 비울 수 없어요.'), null;
        const rs = cleanText(reason.value);
        const rp = textProblem(rs, '정정 사유', 2, 200);
        if (rp) return bad(reason, rp), null;
        const p = { user_id: userSel.value, work_date: wd, in_at: inDate + ' ' + inIn.value, reason: rs };
        if (hasOut) p.out_at = outDate + ' ' + outIn.value;
        if (late.value) p.late = late.value;
        return p;
      }, editing ? '정정 저장' : '추가 저장');
  }
  addBtn.addEventListener('click', function () { if (isHQ && !branchId) { note('warn', '누락 기록을 추가하려면 먼저 지점을 고르고\'조회\'를 눌러 주세요.'); return; } openCorrect(null); });

  /* ---------- 시작 ---------- */
  if (isHQ) {
    apiCall('listBranches').then(function (r) {
      if (!ctx.isCurrent()) return;
      if (!r || !Array.isArray(r.branches)) throw new ApiError('BAD_RESPONSE', '서버 응답 형식이 올바르지 않습니다.');
      branches = r.branches;
      branchSel.replaceChildren.apply(branchSel, [h('option', { value: '' }, '전체 지점')].concat(branches.map(function (b) { return h('option', { value: b.branch_id }, String(b.name)); })));
      branchSel.value = branchId;
    }).catch(function (x) {
      const e = wrapError(x);
      if (!ctx.isCurrent() || handleCommonError(e)) return;
      note('bad', '지점 목록을 불러오지 못했어요. ' + e.message);
    });
  }
  load();
}
/* ===================== 7-6: 엑셀 저장 (CSV, 외부 라이브러리 없음) ===================== */
const EXPORT_MAX_DAYS = 62;
const PLAN_STATE_TEXT = { APPROVED: '승인된 계획', UNAPPROVED: '승인 전 계획', EXCEPTION: '예외' };
const REVIEW_STATUS_TEXT = { NONE: '해당 없음', PENDING: '확인 대기', CONFIRMED: '확인됨' };
/* 엑셀이 수식으로 해석하는 시작 문자(= + - @ 탭 CR)를 막는다(CSV 수식 주입 방어). 숫자 타입은 그대로. */
function csvCell(v) {
  if (v == null) return '';
  if (typeof v === 'number') return Number.isFinite(v) ? String(v) : '';
  let s = String(v).replace(/\r\n|\r|\n/g, ' ');
  if (/^[=+\-@\t]/.test(s)) s = "'" + s;
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function csvText(header, rows) {
  const lines = [header.map(csvCell).join(',')];
  rows.forEach(function (r) { lines.push(r.map(csvCell).join(',')); });
  return '﻿' + lines.join('\r\n') + '\r\n';
}
function hmText(min) { const n = Number(min); if (min == null || !Number.isFinite(n) || n < 0) return ''; return Math.floor(n / 60) + ':' + pad2(Math.round(n % 60)); }
function attStatusText(r) { return r.open ? (r.stale ? '퇴근 미기록(오래됨)' : '근무 중') : '퇴근 완료'; }
function lateText(r) { return r.late === true ? '지각' : r.late === false ? '지각 아님' : '미지정'; }
const ATT_HEADER = ['근무일', '지점', '직원', '계획 코드', '계획 시작', '계획 종료', '출근', '퇴근', '근무(분)', '근무(시:분)', '상태', '계획 대비 출근(분, +늦음)', '지각', '계획 상태', '확인 상태', '확인 사유', '확인 메모', '입력 방식', '정정 사유'];
function attRows(records, branchName) {
  const list = records.slice().sort(function (a, b) { return String(a.work_date).localeCompare(String(b.work_date)) || String(a.user_name || '').localeCompare(String(b.user_name || ''), 'ko'); });
  return list.map(function (r) {
    const p = r.plan || {};
    return [r.work_date, branchName(r.branch_id), r.user_name || r.user_id, p.code || '', p.start || '', p.end || '',
      fmtHM(r.in_at) === '-' ? '' : fmtHM(r.in_at), r.out_at ? fmtHM(r.out_at) : '',
      r.work_min != null && Number.isFinite(Number(r.work_min)) ? Number(r.work_min) : null, hmText(r.work_min), attStatusText(r),
      r.in_diff_min != null && Number.isFinite(Number(r.in_diff_min)) ? Number(r.in_diff_min) : null, lateText(r),
      PLAN_STATE_TEXT[r.plan_state] || '', REVIEW_STATUS_TEXT[r.review_status] || '', attReasonsText(r.review_reasons), r.review_note || '',
      r.source === 'MANUAL' ? '수기 입력' : '앱', r.correct_reason || ''];
  });
}
const SUM_HEADER = ['지점', '직원', '기록 일수', '기록상 근무 합계(분)', '근무 합계(시:분)', '지각 건수', '퇴근 미기록 건수', '확인 대기 건수'];
function sumRows(records, branchName) {
  const m = {};
  records.forEach(function (r) {
    const k = r.branch_id + '|' + r.user_id;
    const o = m[k] || (m[k] = { b: r.branch_id, n: r.user_name || r.user_id, days: 0, min: 0, late: 0, open: 0, pend: 0 });
    o.days += 1;
    if (r.work_min != null && Number.isFinite(Number(r.work_min))) o.min += Number(r.work_min);
    if (r.late === true) o.late += 1;
    if (r.open) o.open += 1;
    if (r.review_status === 'PENDING') o.pend += 1;
  });
  return Object.keys(m).map(function (k) { return m[k]; })
    .sort(function (a, b) { return String(a.b).localeCompare(String(b.b)) || a.n.localeCompare(b.n, 'ko'); })
    .map(function (o) { return [branchName(o.b), o.n, o.days, o.min, hmText(o.min), o.late, o.open, o.pend]; });
}
function safeFileName(s) { return String(s).replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 60); }
function saveTextFile(name, text) {
  const blob = new Blob([text], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.style.display = 'none';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
}

function renderExport(host, ctx) {
  const me = ctx.user;
  const isHQ = me.role === 'HQ';
  const today = kstTodayStr();
  let branches = [];
  let busy = false;
  const wrap = h('div', { class: 'stack' });
  host.append(wrap);
  const noteHost = h('div');
  const fromIn = h('input', { id: 'ex-from', type: 'date' });
  const toIn = h('input', { id: 'ex-to', type: 'date' });
  fromIn.value = today.slice(0, 7) + '-01'; toIn.value = today;
  const branchSel = isHQ ? selectInput('ex-branch', [['', '전체 지점']], '') : null;
  const detailBtn = h('button', { type: 'button', class: 'btn primary' }, '근태 기록 저장');
  const sumBtn = h('button', { type: 'button', class: 'btn' }, '직원별 요약 저장');
  wrap.append(h('section', { class: 'card' }, h('h2', null, '엑셀 저장'),
    h('p', { class: 'sub' }, '엑셀로 열리는 CSV 파일로 저장해요. 위치(거리) 정보는 담지 않아요.'),
    h('div', { class: 'row2' }, fieldBox('ex-from', '시작일', fromIn), fieldBox('ex-to', '종료일', toIn)),
    isHQ ? fieldBox('ex-branch', '지점', branchSel) : null,
    h('div', { class: 'formbtns' }, detailBtn, sumBtn),
    h('p', { class: 'sub' }, '직원별 요약의 근무 합계는 기록된 근무 시간을 단순히 더한 참고 값이에요. 초과근무·휴가 환산은 반영하지 않아요.')), noteHost);

  function note(kind, text) { noteHost.replaceChildren(h('p', { class: 'msg ' + kind, role: 'status', style: 'margin-top:0' }, text)); announce(text); }
  function bName(id) { const b = branches.find(function (x) { return x.branch_id === id; }); return b ? b.name : (id === me.branch_id ? me.branch_name || id : id); }

  if (isHQ) {
    apiCall('listBranches', {}).then(function (r) {
      if (!ctx.isCurrent() || !r || !Array.isArray(r.branches)) return;
      branches = r.branches;
      r.branches.forEach(function (b) { const o = h('option', { value: b.branch_id }, b.name + (b.status === 'ACTIVE' ? '' : ' (중지)')); branchSel.append(o); });
    }).catch(function (x) { const e = wrapError(x); if (ctx.isCurrent()) handleCommonError(e); });
  }

  async function run(kind) {
    if (busy) return;
    noteHost.replaceChildren();
    const f = fromIn.value, t = toIn.value;
    if (!okDate(f) || !okDate(t)) return note('bad', '저장할 기간(시작일·종료일)을 입력해 주세요.');
    if (f > t) return note('bad', '시작일이 종료일보다 늦어요.');
    if (daysApart(f, t) > EXPORT_MAX_DAYS - 1) return note('bad', '한 번에 최대 ' + EXPORT_MAX_DAYS + '일까지 저장할 수 있어요.');
    busy = true; detailBtn.disabled = true; sumBtn.disabled = true;
    try {
      const params = { from: f, to: t, filter: 'ALL' };
      const bid = isHQ ? branchSel.value : '';
      if (bid) params.branch_id = bid;
      const r = await apiCall('listAttendance', params);
      if (!ctx.isCurrent()) return;
      if (!r || !Array.isArray(r.records)) throw new ApiError('BAD_RESPONSE', '서버 응답 형식이 올바르지 않습니다.');
      if (r.truncated) return note('bad', '기록이 너무 많아 일부만 조회됐어요. 일부만 저장하면 집계가 틀어지므로 저장하지 않았어요. 기간이나 지점을 좁혀 주세요.');
      if (!r.records.length) return note('warn', '이 기간에는 저장할 기록이 없어요.');
      const label = bid ? bName(bid) : (isHQ ? '전체지점' : bName(me.branch_id));
      if (kind === 'detail') {
        saveTextFile('근태기록_' + safeFileName(label) + '_' + f + '_' + t + '.csv', csvText(ATT_HEADER, attRows(r.records, bName)));
      } else {
        saveTextFile('직원별요약_' + safeFileName(label) + '_' + f + '_' + t + '.csv', csvText(SUM_HEADER, sumRows(r.records, bName)));
      }
      note('ok', r.records.length + '건을 저장했어요. 다운로드 폴더를 확인해 주세요.');
    } catch (x) {
      const e = wrapError(x);
      if (!ctx.isCurrent() || handleCommonError(e)) return;
      note('bad', e.message);
    } finally { busy = false; detailBtn.disabled = false; sumBtn.disabled = false; }
  }
  detailBtn.addEventListener('click', function () { run('detail'); });
  sumBtn.addEventListener('click', function () { run('sum'); });
}

/* 탭 레지스트리 — 이후 단계는 render 만 채운다. stage 가 있으면 '준비 중' 표시 */
const TABS = {
  STAFF: [
    { id: 'home', label: '시작', render: renderHome },
    { id: 'clock', label: '출퇴근', render: renderClock },
    { id: 'mine', label: '내 기록', render: renderMine }
  ],
  GM: [
    { id: 'home', label: '시작', render: renderHome },
    { id: 'clock', label: '내 출퇴근', render: renderClock },
    { id: 'mine', label: '내 기록', render: renderMine },
    { id: 'today', label: '오늘 현황', render: renderToday },
    { id: 'plan', label: '월간 계획', render: renderPlan },
    { id: 'staff', label: '직원', render: renderStaff },
    { id: 'codes', label: '근무코드', render: renderCodes },
    { id: 'review', label: '근태 검토', render: renderReview },
    { id: 'export', label: '엑셀 저장', stage: '7-6', render: renderExport }
  ],
  HQ: [
    { id: 'home', label: '시작', render: renderHome },
    { id: 'today', label: '전 지점 현황', render: renderToday },
    { id: 'plan', label: '월간 계획', render: renderPlan },
    { id: 'branches', label: '지점', render: renderBranches },
    { id: 'staff', label: '직원', render: renderStaff },
    { id: 'codes', label: '근무코드', render: renderCodes },
    { id: 'review', label: '근태 검토', render: renderReview },
    { id: 'export', label: '엑셀 저장', stage: '7-6', render: renderExport }
  ]
};

/* 여러 화면에서 공통으로 처리할 오류. true 를 돌려주면 이미 처리됨 */
function handleCommonError(e) {
  if (!(e instanceof ApiError)) return false;
  if (e.code === 'AUTH') return true; // onAuthLost 가 로그인 화면으로 이동
  if (e.code === 'PIN_CHANGE_REQUIRED') { Session.updateUser({ pin_must_change: true }); route(); return true; }
  return false;
}

let currentTab = null;
let renderSeq = 0;
function showShell() {
  const sess = Session.get();
  if (!sess) { showLogin(); return; }
  const user = sess.user;
  const tabs = TABS[user.role];
  if (!tabs) { showFatal('이 계정의 역할을 확인할 수 없어요. 관리자에게 문의해 주세요.'); return; }
  if (!currentTab || !tabs.some(function (t) { return t.id === currentTab; })) currentTab = tabs[0].id;
  Google.setHandler(null);
  startExpiryTimer();

  const main = h('main', { id: 'main' });
  const nav = h('nav', { class: 'nav', 'aria-label': '메뉴' });
  const select = function (id) {
    currentTab = id;
    Array.prototype.forEach.call(nav.children, function (b) {
      if (b.dataset.id === id) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    const seq = ++renderSeq;
    main.replaceChildren();
    const tab = tabs.filter(function (t) { return t.id === id; })[0];
    try {
      tab.render(main, { user: user, go: select, isCurrent: function () { return seq === renderSeq; } });
    } catch (e) {
      console.error(e);
      main.replaceChildren(h('p', { class: 'msg bad', role: 'alert' }, '이 화면을 표시하지 못했어요. 새로고침 후 다시 시도해 주세요.'));
    }
  };
  tabs.forEach(function (t) {
    nav.append(h('button', { type: 'button', 'data-id': t.id, onclick: function () { select(t.id); } },
      t.label, t.stage ? h('span', { class: 'soon' }, t.stage) : null));
  });

  const app = h('div', { class: 'app' },
    h('header', { class: 'bar' },
      h('div', null, h('h1', null, 'AZMT 근태 통합 시스템'),
        h('div', { class: 'who' }, h('b', null, user.name), ' · ' + (ROLE_LABEL[user.role] || user.role) + ' · ' + (user.branch_name || user.branch_id || '-'))),
      h('div', { class: 'actions' },
        h('button', { type: 'button', class: 'btn small', onclick: function () { showChangePin(false); } }, 'PIN 변경'),
        h('button', { type: 'button', class: 'btn small', onclick: function () { doLogout(); } }, '로그아웃'))),
    nav, main,
    h('p', { class: 'ver' }, 'v' + CONFIG.VERSION));
  root.replaceChildren(app);
  select(currentTab);
}

function showFatal(text) {
  mount(h('div', { class: 'auth' }, h('main', { class: 'auth-card' }, h('h1', null, '이용할 수 없어요'), h('p', { class: 'msg bad', role: 'alert' }, text),
    h('button', { type: 'button', class: 'btn small', style: 'margin-top:12px', onclick: function () { doLogout(); } }, '로그아웃'))));
}

/* ===================== 라우팅 · 시작 ===================== */
function route() {
  const s = Session.get();
  if (!s) { showLogin(); return; }
  if (s.user.pin_must_change) { stopExpiryTimer(); startExpiryTimer(); showChangePin(true); return; }
  showShell();
}

Api.onAuthLost = function (msg) { showLogin(msg || '로그인이 만료되었어요. 다시 로그인해 주세요.'); };

async function boot() {
  const s = Session.get();
  if (!s) { showLogin(); return; }
  mount(h('div', { class: 'auth' }, h('main', { class: 'auth-card' }, h('h1', null, '확인하는 중…'), h('p', { class: 'sub' }, '로그인 상태를 확인하고 있어요.'))));
  try {
    const r = await apiCall('me');
    if (!r || !r.user || !r.user.role) throw new ApiError('BAD_RESPONSE', '서버 응답 형식이 올바르지 않습니다.');
    Session.updateUser(r.user);
    route();
  } catch (e) {
    if (e instanceof ApiError && e.code === 'AUTH') return; // onAuthLost 가 처리
    mount(h('div', { class: 'auth' }, h('main', { class: 'auth-card' },
      h('h1', null, '연결할 수 없어요'), h('p', { class: 'msg bad', role: 'alert' }, friendly(e)),
      h('div', { style: 'display:flex;gap:8px;margin-top:12px' },
        h('button', { type: 'button', class: 'btn primary small', onclick: boot, 'data-autofocus': '1' }, '다시 시도'),
        h('button', { type: 'button', class: 'btn small', onclick: function () { Session.clear(); showLogin(); } }, '로그아웃')))));
  }
}
boot();
